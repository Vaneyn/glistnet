<!DOCTYPE html>
<html>
<head>
  <title>Угадай число</title>
  

    	<style>
		body {
			color: black;
			background-color: grey;
		}
		button {
		font-size: 20px;
			color: white;
			background-color: black;
		}
	</style>
  
</head>
<body>
  <h1>Игра "Угадай число"</h1>
  <p>Отгадайте число от 1 до 1000:</p>
  <input type="number" id="guessInput" min="1" max="1000">
  <button id="tryButton" onclick="checkGuess()">Попробовать</button>
  <p id="result"></p>
  <p>Количество попыток: <span id="attempts">0</span></p>
  <p>Текущее количество GM: <span id="gmValueDisplay">0</span></p>

	<script>
		function runTool(toolName) {
			var url = toolName + ".html";
			window.open(url, "_blank");
		}
	</script>
			<button onclick="runTool('glist')">НАЗАД</button>
		
  
  <script>
    const maxNumber = 1000;
    let secretNumber;
    let attempts = 0;
    let gmValue = 0;

    function generateSecretNumber() {
      secretNumber = Math.floor(Math.random() * maxNumber) + 1;
    }

    function checkGuess() {
      const guessInput = document.getElementById('guessInput');
      const tryButton = document.getElementById('tryButton');
      const result = document.getElementById('result');
      const attemptsDisplay = document.getElementById('attempts');
      const gmValueDisplay = document.getElementById('gmValueDisplay');
      const guess = parseInt(guessInput.value);

      if (isNaN(guess) || guess < 1 || guess > maxNumber) {
        result.textContent = 'Введите число от 1 до 1000';
        return;
      }

      attempts++;
      attemptsDisplay.textContent = attempts;

      if (guess === secretNumber) {
        result.textContent = `Поздравляем! Вы угадали число ${secretNumber} за ${attempts} попыток.`;
        const gmIncrease = updateGMValue();
        if (gmIncrease > 0) {
          result.textContent += ` Количество GM увеличилось на ${gmIncrease}.`;
        }
        tryButton.disabled = true; // Заблокировать кнопку после окончания игры
      } else if (guess < secretNumber) {
        result.textContent = 'Загаданное число больше';
      } else {
        result.textContent = 'Загаданное число меньше';
      }
    }

    function updateGMValue() {
      let gmIncrease = 0;
      if (attempts <= 1) {
        gmValue += 1;
        gmIncrease = 1;
      } else if (attempts <= 5) {
        gmValue += 0.2;
        gmIncrease = 0.2;
      } else if (attempts <= 10) {
        gmValue += 0.05;
        gmIncrease = 0.05;
      }

      // Обновление текущего значения GM на экране
      const gmValueDisplay = document.getElementById('gmValueDisplay');
      gmValueDisplay.textContent = gmValue;

      // Сохранение gmValue в IndexedDB
      const request = indexedDB.open('myDatabase', 1);
      request.onsuccess = event => {
        const db = event.target.result;
        const transaction = db.transaction(['GM'], 'readwrite');
        const objectStore = transaction.objectStore('GM');
        const updateRequest = objectStore.put({ id: '1', value: gmValue });

        updateRequest.onsuccess = () => {
          console.log('GM value updated successfully');
        };

        updateRequest.onerror = () => {
          console.error('GM value not updated');
        };
      };

      return gmIncrease;
    }

    // Получение начального значения GM из хранилища
    const request = indexedDB.open('myDatabase', 1);
    request.onsuccess = event => {
      const db = event.target.result;
      const transaction = db.transaction(['GM'], 'readonly');
      const objectStore = transaction.objectStore('GM');
      const getRequest = objectStore.get('1');

      getRequest.onsuccess = event => {
        if (event.target.result) {
          gmValue = event.target.result.value;
          const gmValueDisplay = document.getElementById('gmValueDisplay');
          gmValueDisplay.textContent = gmValue;
        }
      };
    };

    generateSecretNumber();
  </script>
</body>
</html>
