<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сборник</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4e7ec 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      color: #2d3748;
      line-height: 1.5;
    }

    .header {
      text-align: center;
      margin-bottom: 15px;
      max-width: 900px;
      width: 100%;
    }

    #title {
      font-size: 1.6rem;
      font-weight: 800;
      margin: 10px 0 5px;
      color: #2d3748;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 1.1rem;
      color: #718096;
      margin-bottom: 15px;
      font-weight: 500;
    }

    #buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 900px;
      width: 100%;
      margin-bottom: 20px;
    }

    .tool-button {
      padding: 14px 16px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(145deg, #ffffff, #f8fafc);
      color: #2d3748;
      font-size: 0.95rem;
      font-weight: 600;
      box-shadow: 
        3px 3px 8px rgba(0, 0, 0, 0.05),
        -3px -3px 8px rgba(255, 255, 255, 0.8);
      transition: all 0.25s ease;
      cursor: pointer;
      text-align: left;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      min-height: 70px;
      border: 1px solid rgba(226, 232, 240, 0.5);
    }

    .tool-button::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 3px;
      height: 100%;
      background: #4a90e2;
      transform: scaleY(0);
      transition: transform 0.2s ease;
      transform-origin: bottom;
    }

    .tool-button:hover {
      transform: translateY(-2px);
      box-shadow: 
        5px 5px 12px rgba(0, 0, 0, 0.08),
        -5px -5px 12px rgba(255, 255, 255, 0.8);
      color: #3182ce;
    }

    .tool-button:hover::before {
      transform: scaleY(1);
      transform-origin: top;
    }

    .tool-button:active {
      transform: translateY(1px);
    }

    #back {
      padding: 12px 28px;
      background: linear-gradient(145deg, #6c7a89, #7f8c8d);
      color: white;
      border-radius: 10px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      box-shadow: 3px 3px 8px rgba(0, 0, 0, 0.1);
      transition: all 0.25s ease;
      cursor: pointer;
      margin-top: 15px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #back:hover {
      background: linear-gradient(145deg, #5d6d7e, #6c7a89);
      transform: translateY(-1px);
    }

    #back:active {
      transform: translateY(1px);
    }

    .container {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @media (max-width: 900px) {
      #buttons {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      #buttons {
        grid-template-columns: 1fr;
      }
      
      .tool-button {
        min-height: 65px;
        font-size: 0.9rem;
      }
      
      #title {
        font-size: 1.4rem;
      }
      
      .subtitle {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div id="title"></div>
      <div class="subtitle">Я хочу...</div>
    </div>
    
    <div id="buttons"></div>
    
    <button id="back" onclick="window.location.href='glist.html'">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M19 12H5M12 19L5 12L12 5" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Назад
    </button>
  </div>

  <script>
    const titles = [
      "Баловство", "Всячина", "Хламотерапия", "Всякоразное", "Глупости",
      "Развлечения", "Балбесность", "Вестник прокрастинации", "Шиза разраба",
      "Какашка в кармашке", "Дрянь", "Фигня всякая", "Разное ужасное",
      "Тайм-киллер", "Мусорка", "Какеш", "Творческий кризис",
      "Дыра профурсетки", "Чай-бутерброд", "Новые злоключения"
    ];

    function getRandomTitle() {
      const mostly = "Развлечения";
      return Math.random() < 0.9 ? mostly : titles[Math.floor(Math.random() * titles.length)];
    }

    document.getElementById('title').textContent = getRandomTitle();

    const tools = [
      { label: "Выпить и поехать в лес", file: "nepriyatno.html" },

      { label: "Послать нахуй", file: "fuckyou.html" },
      { label: "Музыкально послать нахер через пианино", file: "piano.html" },
      { label: "Полетать в космосе", file: "kosmos.html" },
      { label: "Сделать QR код", file: "qr.html" },
      { label: "Узнать, сколько памяти займет текст", file: "textisbig.html" },
      { label: "Услышать перл разраба", file: "not.html" },
      { label: "Придумать отмазку", file: "otmazka.html" },
      { label: "Нарисовать чета", file: "paint.html" },
      { label: "Разобраться в сером", file: "gray50.html" },
        ];

    const container = document.getElementById('buttons');
    tools.forEach(tool => {
      const btn = document.createElement('button');
      btn.className = 'tool-button';
      btn.textContent = tool.label;
      btn.onclick = () => window.location.href = tool.file;
      container.appendChild(btn);
    });

    // Анимация появления кнопок
    document.addEventListener('DOMContentLoaded', () => {
      const buttons = document.querySelectorAll('.tool-button');
      buttons.forEach((btn, i) => {
        btn.style.opacity = '0';
        btn.style.transform = 'translateY(10px)';
        btn.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
        
        setTimeout(() => {
          btn.style.opacity = '1';
          btn.style.transform = 'translateY(0)';
        }, i * 50);
      });
    });

    // Обработчик для кнопки "Назад"
    document.getElementById('back').addEventListener('click', function() {
      window.location.href = 'glist.html';
    });
  </script>
</body>
</html>
