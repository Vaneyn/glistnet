    function collectAtGrid(gx, gz) {
      for (let i = 0; i < cornerDots.length; i++) {
        const d = cornerDots[i];
        if (!d.visited && d.gx === gx && d.gz === gz) {
          d.visited = true;
          hideCornerDotAt(i);
          gameState.visitedCorners++;
          if (gameState.started) {
            gameState.score += 10;
            updateScoreDisplay();
            playSound('dot');
          }
          break;
        }
      }

      for (let i = 0; i < powerPellets.length; i++) {
        const p = powerPellets[i];
        if (p.active && p.gx === gx && p.gz === gz) {
          p.active = false;
          if (p.group) p.group.visible = false;
          gameState.powerTimer = 10.5;
          playSound('power');
          gameState.score += 50;
          updateScoreDisplay();
        }
      }

      if (!gameState.portalOpen && gameState.visitedCorners >= gameState.totalCorners) {
        gameState.portalOpen = true;
        if (portalGroup) portalGroup.visible = true;
        playSound('portal_open');
      }

      if (gameState.portalOpen && gx === PORTAL_GX && gz === PORTAL_GZ) {
        startVictoryCutscene();
      }
    }

    // Relative turn input with corner-turning buffer & instant reversal
    function handleRelativeTurn(turnOffset) {
      if (appMode !== 'game' || gameState.gameOver || gameState.victory) return;
      ensureAudio();

      if (!gameState.started) {
        gameState.started = true;
      }

      const newDir = turnOffset === 0
        ? wormEntity.dir
        : (wormEntity.dir + turnOffset + 4) % 4;
      wormEntity.queuedDir = newDir;

      const oppositeDir = (wormEntity.dir + 2) % 4;
      if (newDir === oppositeDir && wormEntity.moveProgress > 0) {
        // Instant 180-degree reversal mid-corridor
        const tmpGx = wormEntity.gx;
        const tmpGz = wormEntity.gz;
        wormEntity.gx = wormEntity.targetGx;
        wormEntity.gz = wormEntity.targetGz;
        wormEntity.targetGx = tmpGx;
        wormEntity.targetGz = tmpGz;
        wormEntity.dir = oppositeDir;
        wormEntity.moveProgress = 1.0 - wormEntity.moveProgress;
      } else if (newDir !== wormEntity.dir) {
        // Corner-cutting forgiveness: if slightly past a tile center (< 0.28) and the turn is open at (gx, gz), take it immediately
        const qd = DIRS[newDir];
        if (wormEntity.moveProgress <= 0.28 && !isWall(wormEntity.gx + qd.dx, wormEntity.gz + qd.dz)) {
          wormEntity.dir = newDir;
          wormEntity.targetGx = wormEntity.gx + qd.dx;
          wormEntity.targetGz = wormEntity.gz + qd.dz;
          wormEntity.moveProgress = 0;
        }
      }
    }

    function updateWormMovement(dt, elapsed) {
      if (gameState.gameOver || gameState.victory) return;

      if (!gameState.started) {
        positionWormAlongPath(elapsed);
        return;
      }

      const tryStartNextTile = () => {
        const qd = DIRS[wormEntity.queuedDir];
        if (!isWall(wormEntity.gx + qd.dx, wormEntity.gz + qd.dz)) {
          wormEntity.dir = wormEntity.queuedDir;
        }
        const cd = DIRS[wormEntity.dir];
        if (!isWall(wormEntity.gx + cd.dx, wormEntity.gz + cd.dz)) {
          wormEntity.targetGx = wormEntity.gx + cd.dx;
          wormEntity.targetGz = wormEntity.gz + cd.dz;
          return true;
        }
        wormEntity.moveProgress = 0;
        return false;
      };

      if (wormEntity.gx === wormEntity.targetGx && wormEntity.gz === wormEntity.targetGz) {
        tryStartNextTile();
      }

      if (wormEntity.gx !== wormEntity.targetGx || wormEntity.gz !== wormEntity.targetGz) {
        wormEntity.moveProgress += dt * wormEntity.speed;
        while (wormEntity.moveProgress >= 1.0) {
          wormEntity.gx = wormEntity.targetGx;
          wormEntity.gz = wormEntity.targetGz;
          wormEntity.moveProgress -= 1.0;
          collectAtGrid(wormEntity.gx, wormEntity.gz);
          if (gameState.victory || !tryStartNextTile()) {
            wormEntity.moveProgress = 0;
            break;
          }
        }
      }

      const pA = gridToWorld(wormEntity.gx, wormEntity.gz);
      const pB = gridToWorld(wormEntity.targetGx, wormEntity.targetGz);
      const headX = pA.x + (pB.x - pA.x) * wormEntity.moveProgress;
      const headZ = pA.z + (pB.z - pA.z) * wormEntity.moveProgress;
      const headAngle = DIRS[wormEntity.dir].angle;

      const firstPt = wormEntity.pathPoints[0];
      const stepDist = Math.hypot(headX - firstPt.x, headZ - firstPt.z);
      if (stepDist > 0.015) {
        wormEntity.pathPoints.unshift({ x: headX, z: headZ, angle: headAngle });
        if (wormEntity.pathPoints.length > 180) wormEntity.pathPoints.pop();
      } else {
        firstPt.angle = headAngle;
      }

      positionWormAlongPath(elapsed);
    }

    function updateMokhnatkasAI(dt, elapsed) {
      if (!gameState.started || gameState.gameOver || gameState.victory) return;

      gameState.timeSinceStart += dt;
      const isPowerActive = gameState.powerTimer > 0;
      const wormPos = wormEntity.segments[0].position;
      const spawnWorld = gridToWorld(SPAWN_GX, SPAWN_GZ);

      mokhnatkaEntities.forEach((m, idx) => {
        if (!m.spawned) {
          if (gameState.timeSinceStart >= m.spawnDelay) {
            m.spawned = true;
            m.spawnAnim = 0.01;
            m.root.visible = true;
            m.gx = SPAWN_GX;
            m.gz = SPAWN_GZ;
            m.targetGx = SPAWN_GX;
            m.targetGz = SPAWN_GZ;
            m.root.position.set(spawnWorld.x, 0.0, spawnWorld.z);
          } else {
            return;
          }
        }

        if (m.eatenRespawnTimer > 0) {
          m.eatenRespawnTimer -= dt;
          m.root.scale.setScalar(0.001);
          if (m.eatenRespawnTimer <= 0) {
            m.spawnAnim = 0.01;
            m.furMesh.material.emissive.setHex(0x000000);
          }
          return;
        }

        if (m.spawnAnim < 1.0) {
          m.spawnAnim = Math.min(1.0, m.spawnAnim + dt * 1.8);
          m.root.scale.setScalar(m.spawnAnim * 0.95);
          m.root.position.set(spawnWorld.x, 0.0, spawnWorld.z);
          return;
        }

        if (isPowerActive) {
          const flash = gameState.powerTimer < 2.2 && Math.floor(elapsed * 8) % 2 === 0;
          m.furMesh.material.emissive.setHex(flash ? 0xffffff : 0x0284c7);
          m.furMesh.material.emissiveIntensity = 0.65;
        } else {
          m.furMesh.material.emissive.setHex(0x000000);
          m.furMesh.material.emissiveIntensity = 0.0;
        }

        const chooseNextDir = () => {
          const validDirs = [];
          const oppositeDir = (m.dir + 2) % 4;

          for (let d = 0; d < 4; d++) {
            const nx = m.gx + DIRS[d].dx;
            const nz = m.gz + DIRS[d].dz;
            if (!isWall(nx, nz)) validDirs.push(d);
          }

          const nonReverse = validDirs.filter(d => d !== oppositeDir);
          const choices = nonReverse.length > 0 ? nonReverse : validDirs;

          if (choices.length > 0) {
            let bestDir = choices[0];
            let bestScore = isPowerActive ? -Infinity : Infinity;

            choices.forEach(d => {
              const nx = m.gx + DIRS[d].dx;
              const nz = m.gz + DIRS[d].dz;
              const distSq = (nx - wormEntity.gx) ** 2 + (nz - wormEntity.gz) ** 2 + (Math.random() * 6.0);
              if (isPowerActive) {
                if (distSq > bestScore) { bestScore = distSq; bestDir = d; }
              } else {
                if (distSq < bestScore) { bestScore = distSq; bestDir = d; }
              }
            });

            m.dir = bestDir;
            m.targetGx = m.gx + DIRS[m.dir].dx;
            m.targetGz = m.gz + DIRS[m.dir].dz;
          }
        };

        if (m.gx === m.targetGx && m.gz === m.targetGz) {
          chooseNextDir();
        }

        const currentSpeed = isPowerActive ? m.speed * 0.62 : m.speed;
        m.moveProgress += dt * currentSpeed;
        while (m.moveProgress >= 1.0) {
          m.gx = m.targetGx;
          m.gz = m.targetGz;
          m.moveProgress -= 1.0;
          chooseNextDir();
        }

        const pA = gridToWorld(m.gx, m.gz);
        const pB = gridToWorld(m.targetGx, m.targetGz);
        const mx = pA.x + (pB.x - pA.x) * m.moveProgress;
        const mz = pA.z + (pB.z - pA.z) * m.moveProgress;
        const bounceY = Math.abs(Math.sin(elapsed * 6.5 + idx)) * 0.22;

        m.root.position.set(mx, bounceY, mz);
        m.root.rotation.y = DIRS[m.dir].angle;
        m.root.scale.setScalar(isPowerActive ? 0.78 : 0.95);

        const distToWorm = Math.hypot(mx - wormPos.x, mz - wormPos.z);
        if (distToWorm < 1.22) {
          if (isPowerActive) {
            gameState.score += 1000;
            updateScoreDisplay();
            playSound('eat_mokhnatka');
            m.gx = SPAWN_GX;
            m.gz = SPAWN_GZ;
            m.targetGx = SPAWN_GX;
            m.targetGz = SPAWN_GZ;
            m.moveProgress = 0;
            m.eatenRespawnTimer = 2.6;
            m.root.position.set(spawnWorld.x, 0.0, spawnWorld.z);
          } else if (gameState.invulnerableTimer <= 0) {
            gameState.lives--;
            playSound('hurt');
            if (gameState.lives <= 0) {
              gameState.gameOver = true;
              syncBgMusic();
              document.getElementById('gameover-modal').style.display = 'flex';
            } else {
              gameState.invulnerableTimer = 2.4;
              resetWormPosition();
            }
          }
        }
      });
    }

    // ============================================================================
    // OPTIMIZED PAC-MAN MINIMAP (PRE-RENDERED WALL CACHE)
    // ============================================================================
    let minimapBgCanvas = null;
    function ensureMinimapBg(w, h, cell) {
      if (minimapBgCanvas && minimapBgCanvas.width === w && minimapBgCanvas.height === h) {
        return minimapBgCanvas;
      }
      minimapBgCanvas = document.createElement('canvas');
      minimapBgCanvas.width = w;
      minimapBgCanvas.height = h;
      const bCtx = minimapBgCanvas.getContext('2d');

      bCtx.fillStyle = '#02040a';
      bCtx.fillRect(0, 0, w, h);

      bCtx.fillStyle = '#172554';
      bCtx.strokeStyle = '#2563eb';
      bCtx.lineWidth = 1.1;
      for (let gz = 0; gz < GRID_SIZE; gz++) {
        for (let gx = 0; gx < GRID_SIZE; gx++) {
          if (MAZE_LAYOUT[gz][gx] === 1) {
            bCtx.fillRect(gx * cell + 0.8, gz * cell + 0.8, cell - 1.6, cell - 1.6);
            bCtx.strokeRect(gx * cell + 0.8, gz * cell + 0.8, cell - 1.6, cell - 1.6);
          }
        }
      }

      // Spawn Burrow Marker (8, 6)
      bCtx.strokeStyle = 'rgba(244, 63, 94, 0.55)';
      bCtx.lineWidth = 1.2;
      bCtx.beginPath();
      bCtx.arc((SPAWN_GX + 0.5) * cell, (SPAWN_GZ + 0.5) * cell, 3.8, 0, Math.PI * 2);
      bCtx.stroke();

      return minimapBgCanvas;
    }

    function drawPacMinimap(elapsed) {
      const canvas = document.getElementById('minimap-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const mapH = w;
      const cell = w / GRID_SIZE;

      // 1. Blit cached static walls & background
      ctx.drawImage(ensureMinimapBg(w, canvas.height, cell), 0, 0);

      // 2. Unvisited Corner Dots (batched single path)
      ctx.fillStyle = '#fde047';
      ctx.beginPath();
      for (let i = 0; i < cornerDots.length; i++) {
        const d = cornerDots[i];
        if (!d.visited) {
          const cx = (d.gx + 0.5) * cell;
          const cz = (d.gz + 0.5) * cell;
          ctx.moveTo(cx + 1.7, cz);
          ctx.arc(cx, cz, 1.7, 0, Math.PI * 2);
        }
      }
      ctx.fill();

      // 3. Flashing Power Pellets
      if (Math.floor(elapsed * 4) % 2 === 0) {
        ctx.fillStyle = '#22d3ee';
        powerPellets.forEach(p => {
          if (p.active) {
            ctx.beginPath();
            ctx.arc((p.gx + 0.5) * cell, (p.gz + 0.5) * cell, 3.8, 0, Math.PI * 2);
            ctx.fill();
          }
        });
      }

      // 4. Exit Portal in Center (PORTAL_GX, PORTAL_GZ)
      if (gameState.portalOpen) {
        ctx.strokeStyle = '#c084fc';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc((PORTAL_GX + 0.5) * cell, (PORTAL_GZ + 0.5) * cell, 4.8, 0, Math.PI * 2);
        ctx.stroke();
      }

      // 5. Stitched 6-Segment Lime Worm
      for (let i = 5; i >= 0; i--) {
        const segPos = wormEntity.segments[i].position;
        const mx = (segPos.x / TILE_SIZE + HALF_GRID + 0.5) * cell;
        const mz = (segPos.z / TILE_SIZE + HALF_GRID + 0.5) * cell;
        ctx.fillStyle = i === 0 ? '#a3e635' : '#65a30d';
        ctx.beginPath();
        ctx.arc(mx, mz, i === 0 ? 4.0 : 3.2 - i * 0.2, 0, Math.PI * 2);
        ctx.fill();
      }

      // 6. Spawned Mokhnatkas
      mokhnatkaEntities.forEach(m => {
        if (!m.spawned || m.eatenRespawnTimer > 0) return;
        const mx = (m.root.position.x / TILE_SIZE + HALF_GRID + 0.5) * cell;
        const mz = (m.root.position.z / TILE_SIZE + HALF_GRID + 0.5) * cell;
        ctx.fillStyle = gameState.powerTimer > 0 ? '#38bdf8' : m.config.mapColor;
        ctx.beginPath();
        ctx.arc(mx, mz, 4.2, 0, Math.PI * 2);
        ctx.fill();
      });

      // 7. Bottom strip inside minimap: 3 Lives icons + Power bar
      const stripY = mapH + 10;
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = i < gameState.lives ? '#84cc16' : '#1e293b';
        ctx.beginPath();
        ctx.arc(14 + i * 16, stripY, 5.2, 0, Math.PI * 2);
        ctx.fill();
      }

      if (gameState.powerTimer > 0) {
        ctx.fillStyle = '#22d3ee';
        const barW = (gameState.powerTimer / 8.0) * 95;
        ctx.fillRect(w - 102, stripY - 3.5, barW, 7);
      }
    }

    // ============================================================================
    // SHOWCASE / INSPECTOR MODE (ALL MUSHROOMS & CREATURES ON THE GROUND y = 0)
    // ============================================================================
    window.toggleMode = function() {
      if (appMode === 'game') {
        enterShowcaseMode();
      } else {
        resetMazeGame();
      }
    };

    // Custom dependency-free 3D Drag, Throw & Elastic Bounce Physics for Showcase Mode
    let showcaseRaycaster = null;
    let showcaseDragPlane = null;
    let draggedMokhnatka = null;
    let dragOffset = null;
    let dragSamples = [];
    let lastBounceSoundTime = 0;

    function maybePlayBounceSound() {
      const now = performance.now();
      if (now - lastBounceSoundTime > 90) {
        lastBounceSoundTime = now;
        playSound('bounce');
      }
    }

    function tryBeginMokhnatkaDrag(clientX, clientY) {
      if (appMode !== 'showcase') return false;
      if (!showcaseRaycaster) {
        showcaseRaycaster = new THREE.Raycaster();
        showcaseDragPlane = new THREE.Plane();
        dragOffset = new THREE.Vector3();
      }
      const ndc = new THREE.Vector2(
        (clientX / window.innerWidth) * 2 - 1,
        -(clientY / window.innerHeight) * 2 + 1
      );
      showcaseRaycaster.setFromCamera(ndc, camera);

      let bestM = null;
      let bestDist = Infinity;
      const ray = showcaseRaycaster.ray;

      mokhnatkaEntities.forEach(m => {
        const centerY = m.root.position.y + (m.config.bodyCenterY || 1.05) * 1.25;
        const center = new THREE.Vector3(m.root.position.x, centerY, m.root.position.z);
        const distToRay = ray.distanceToPoint(center);
        const camDist = camera.position.distanceTo(center);
        if (distToRay < 1.58 && camDist < bestDist) {
          bestDist = camDist;
          bestM = m;
        }
      });

      if (!bestM) return false;

      ensureAudio();
      draggedMokhnatka = bestM;
      bestM.phys.isDragged = true;
      bestM.phys.vel.set(0, 0, 0);

      const camDir = new THREE.Vector3();
      camera.getWorldDirection(camDir);
      const grabCenter = new THREE.Vector3(
        bestM.root.position.x,
        bestM.root.position.y + (bestM.config.bodyCenterY || 1.05) * 1.25,
        bestM.root.position.z
      );
      showcaseDragPlane.setFromNormalAndCoplanarPoint(camDir, grabCenter);

      const hitPt = new THREE.Vector3();
      if (ray.intersectPlane(showcaseDragPlane, hitPt)) {
        dragOffset.copy(bestM.root.position).sub(hitPt);
      } else {
        dragOffset.set(0, 0, 0);
      }

      dragSamples = [{ pos: bestM.root.position.clone(), time: performance.now() }];
      return true;
    }

    function updateMokhnatkaDrag(clientX, clientY) {
      if (!draggedMokhnatka || appMode !== 'showcase') return false;
      const ndc = new THREE.Vector2(
        (clientX / window.innerWidth) * 2 - 1,
        -(clientY / window.innerHeight) * 2 + 1
      );
      showcaseRaycaster.setFromCamera(ndc, camera);
      const hitPt = new THREE.Vector3();
      if (showcaseRaycaster.ray.intersectPlane(showcaseDragPlane, hitPt)) {
        const targetPos = hitPt.add(dragOffset);
        targetPos.y = Math.max(0.0, Math.min(10.5, targetPos.y));
        const rHoriz = Math.hypot(targetPos.x, targetPos.z);
        if (rHoriz > 7.6) {
          targetPos.x = (targetPos.x / rHoriz) * 7.6;
          targetPos.z = (targetPos.z / rHoriz) * 7.6;
        }

        const now = performance.now();
        dragSamples.push({ pos: targetPos.clone(), time: now });
        while (dragSamples.length > 6 && now - dragSamples[0].time > 90) {
          dragSamples.shift();
        }
        if (dragSamples.length >= 2) {
          const first = dragSamples[0];
          const dtMs = Math.max(8, now - first.time) / 1000;
          draggedMokhnatka.phys.vel.copy(targetPos).sub(first.pos).divideScalar(dtMs);
        }
        draggedMokhnatka.root.position.copy(targetPos);
      }
      return true;
    }

    function endMokhnatkaDrag() {
      if (!draggedMokhnatka) return;
      const m = draggedMokhnatka;
      m.phys.isDragged = false;
      draggedMokhnatka = null;

      const now = performance.now();
      while (dragSamples.length > 2 && now - dragSamples[0].time > 100) {
        dragSamples.shift();
      }
      if (dragSamples.length >= 2) {
        const first = dragSamples[0];
        const last = dragSamples[dragSamples.length - 1];
        const dtSec = Math.max(0.012, (last.time - first.time) / 1000);
        if (now - last.time < 120) {
          m.phys.vel.copy(last.pos).sub(first.pos).divideScalar(dtSec).multiplyScalar(1.12);
        } else {
          m.phys.vel.set(0, 0, 0);
        }
      }
      const speed = m.phys.vel.length();
      if (speed > 26.0) {
        m.phys.vel.multiplyScalar(26.0 / speed);
      }
      dragSamples = [];
    }

    function updateShowcasePhysics(dt, elapsed) {
      const substeps = 2;
      const subDt = dt / substeps;
      const gravity = -24.0;
      const gladeLimit = 7.6;

      for (let step = 0; step < substeps; step++) {
        // 1. Integrate each Mokhnatka + Floor & Boundary Elastic Bounces
        mokhnatkaEntities.forEach(m => {
          if (!m.phys.isDragged) {
            m.phys.vel.y += gravity * subDt;
            m.phys.vel.multiplyScalar(Math.pow(0.94, subDt));
            m.root.position.addScaledVector(m.phys.vel, subDt);

            // Ground collision (y = 0)
            if (m.root.position.y <= 0.0) {
              m.root.position.y = 0.0;
              if (m.phys.vel.y < -1.15) {
                const impact = -m.phys.vel.y;
                m.phys.vel.y = impact * 0.80; // Elastic bounce
                m.phys.vel.x *= 0.92;
                m.phys.vel.z *= 0.92;
                m.phys.squashVel -= Math.min(impact * 1.4, 14.0);
                maybePlayBounceSound();
              } else {
                m.phys.vel.y = 0.0;
                m.phys.vel.x *= Math.pow(0.14, subDt);
                m.phys.vel.z *= Math.pow(0.14, subDt);
              }
            }

            // Circular glade wall bounce
            const rH = Math.hypot(m.root.position.x, m.root.position.z);
            if (rH > gladeLimit && rH > 0.0001) {
              const nx = -m.root.position.x / rH;
              const nz = -m.root.position.z / rH;
              m.root.position.x = -nx * gladeLimit;
              m.root.position.z = -nz * gladeLimit;
              const vn = m.phys.vel.x * nx + m.phys.vel.z * nz;
              if (vn < 0) {
                m.phys.vel.x -= (1 + 0.84) * vn * nx;
                m.phys.vel.z -= (1 + 0.84) * vn * nz;
                m.phys.squashVel -= Math.min(Math.abs(vn) * 1.1, 10.0);
                maybePlayBounceSound();
              }
            }

            // Subtle elastic tilt/roll from horizontal velocity, smoothly righting itself
            m.bodyGroup.rotation.x += m.phys.vel.z * subDt * 0.45;
            m.bodyGroup.rotation.z -= m.phys.vel.x * subDt * 0.45;
            m.bodyGroup.rotation.x *= Math.pow(0.05, subDt);
            m.bodyGroup.rotation.z *= Math.pow(0.05, subDt);
          } else {
            m.bodyGroup.rotation.x *= Math.pow(0.05, subDt);
            m.bodyGroup.rotation.z *= Math.pow(0.05, subDt);
          }

          // Hooke spring for plush squash-and-stretch
          const springAcc = (1.0 - m.phys.squashY) * 68.0 - m.phys.squashVel * 7.5;
          m.phys.squashVel += springAcc * subDt;
          m.phys.squashY = Math.max(0.60, Math.min(1.36, m.phys.squashY + m.phys.squashVel * subDt));
          const sy = 1.25 * m.phys.squashY;
          const sxz = 1.25 / Math.sqrt(m.phys.squashY);
          m.root.scale.set(sxz, sy, sxz);
        });

        // 2. Mokhnatka-to-Mokhnatka 3D Elastic Sphere Collisions
        for (let i = 0; i < mokhnatkaEntities.length; i++) {
          for (let j = i + 1; j < mokhnatkaEntities.length; j++) {
            const a = mokhnatkaEntities[i];
            const b = mokhnatkaEntities[j];
            const ay = a.root.position.y + (a.config.bodyCenterY || 1.05) * 1.25;
            const by = b.root.position.y + (b.config.bodyCenterY || 1.05) * 1.25;
            const dx = b.root.position.x - a.root.position.x;
            const dy = by - ay;
            const dz = b.root.position.z - a.root.position.z;
            const dist = Math.hypot(dx, dy, dz);
            const minDist = a.phys.radius + b.phys.radius;

            if (dist < minDist && dist > 0.0001) {
              const nx = dx / dist;
              const ny = dy / dist;
              const nz = dz / dist;
              const overlap = minDist - dist;

              if (a.phys.isDragged && !b.phys.isDragged) {
                b.root.position.x += nx * overlap;
                b.root.position.y = Math.max(0, b.root.position.y + ny * overlap);
                b.root.position.z += nz * overlap;
              } else if (!a.phys.isDragged && b.phys.isDragged) {
                a.root.position.x -= nx * overlap;
                a.root.position.y = Math.max(0, a.root.position.y - ny * overlap);
                a.root.position.z -= nz * overlap;
              } else {
                a.root.position.x -= nx * overlap * 0.5;
                a.root.position.y = Math.max(0, a.root.position.y - ny * overlap * 0.5);
                a.root.position.z -= nz * overlap * 0.5;
                b.root.position.x += nx * overlap * 0.5;
                b.root.position.y = Math.max(0, b.root.position.y + ny * overlap * 0.5);
                b.root.position.z += nz * overlap * 0.5;
              }

              const rvx = b.phys.vel.x - a.phys.vel.x;
              const rvy = b.phys.vel.y - a.phys.vel.y;
              const rvz = b.phys.vel.z - a.phys.vel.z;
              const velAlongNormal = rvx * nx + rvy * ny + rvz * nz;

              if (velAlongNormal < 0) {
                const restitution = 0.88;
                const imp = -(1 + restitution) * velAlongNormal * ((a.phys.isDragged || b.phys.isDragged) ? 1.0 : 0.5);
                if (!a.phys.isDragged) {
                  a.phys.vel.x -= imp * nx;
                  a.phys.vel.y -= imp * ny;
                  a.phys.vel.z -= imp * nz;
                  a.phys.squashVel -= Math.min(Math.abs(velAlongNormal) * 1.1, 11.0);
                }
                if (!b.phys.isDragged) {
                  b.phys.vel.x += imp * nx;
                  b.phys.vel.y += imp * ny;
                  b.phys.vel.z += imp * nz;
                  b.phys.squashVel -= Math.min(Math.abs(velAlongNormal) * 1.1, 11.0);
                }
                maybePlayBounceSound();
              }
            }
          }
        }
      }
    }

    function enterShowcaseMode() {
      appMode = 'showcase';
      syncBgMusic();
      draggedMokhnatka = null;
      mazeGroup.visible = false;
      victoryGroup.visible = false;
      showcaseGroup.visible = true;

      document.getElementById('minimap-wrap').style.display = 'none';
      document.getElementById('score-screen').style.display = 'none';
      document.getElementById('victory-ui').style.display = 'none';
      document.getElementById('gameover-modal').style.display = 'none';
      document.getElementById('showcase-ui').style.display = 'flex';
      document.getElementById('btn-mode-toggle').textContent = '🎮';

      // Place the 3 Mokhnatkas firmly on the ground (y = 0) with reset physics state
      const positions = [
        { x: -3.2, z: -0.3, rot: 0.25 },
        { x: 0.0,  z: 0.1,  rot: 0.0 },
        { x: 3.2,  z: -0.3, rot: -0.25 }
      ];
      mokhnatkaEntities.forEach((m, idx) => {
        m.root.visible = true;
        m.furMeshGame.visible = false;
        m.furMeshHigh.visible = true;
        m.furMesh = m.furMeshHigh;
        m.root.position.set(positions[idx].x, 0.0, positions[idx].z);
        m.root.rotation.set(0, positions[idx].rot, 0);
        m.bodyGroup.rotation.set(0, 0, 0);
        m.root.scale.setScalar(1.25);
        m.furMesh.material.emissive.setHex(0x000000);
        m.phys.vel.set(0, 0, 0);
        m.phys.squashY = 1.0;
        m.phys.squashVel = 0.0;
        m.phys.isDragged = false;
        m.phys.baseRotY = positions[idx].rot;
      });

      // Place the tightly stitched 6-segment worm on the ground in front (z = 2.4)
      wormEntity.pathPoints = [];
      for (let i = 0; i <= 120; i++) {
        wormEntity.pathPoints.push({
          x: 1.8 - i * 0.05,
          z: 2.3 + Math.sin(i * 0.1) * 0.2,
          angle: Math.PI / 2
        });

      positionWormAlongPath(0);

    window.focusShowcaseTarget = function(target) {
      showcaseTarget = target;
      document.querySelectorAll('.creature-tab').forEach(btn => {
        if (btn.dataset.target) {
          btn.classList.toggle('active', btn.dataset.target === target);
        }
      });
      if (target === 'all') orbitDistance = 16.5;
      else if (target === 'worm') orbitDistance = 9.5;
      else orbitDistance = 7.5;
    };

    window.triggerShowcaseBlink = function() {
      gameState.blinkTimer = 0.28;
    };

    // ============================================================================
    // SWIPE & KEYBOARD CONTROLS (Strictly 1 command per swipe / key press)
    // ============================================================================
    function setupInputAndSwipeHandlers() {
      // Keyboard controls: ignore auto-repeat (e.repeat) so holding a key never fires multiple turns
      window.addEventListener('keydown', e => {
        if (appMode !== 'game' || e.repeat) return;
        const code = e.code;
        if (code === 'KeyA' || code === 'ArrowLeft') {
          e.preventDefault();
          handleRelativeTurn(-1);
        } else if (code === 'KeyD' || code === 'ArrowRight') {
          e.preventDefault();
          handleRelativeTurn(1);
        } else if (code === 'KeyW' || code === 'ArrowUp') {
          e.preventDefault();
          handleRelativeTurn(0);
        } else if (code === 'KeyS' || code === 'ArrowDown') {
          e.preventDefault();
          handleRelativeTurn(2);
        }
      });

      // Unified Pointer & Touch Swipe Controls:
      // Each swipe gesture (down -> move -> up) triggers AT MOST ONE command (swipeConsumed = true)
      const dom = renderer.domElement;
      let swipeStart = null;
      let swipeConsumed = false;

      dom.addEventListener('touchstart', e => {
        if (e.touches.length > 0) {
          const tx = e.touches[0].clientX;
          const ty = e.touches[0].clientY;
          if (appMode === 'game') syncBgMusic();
          swipeStart = { x: tx, y: ty };
          swipeConsumed = false;
          prevPointer.x = tx;
          prevPointer.y = ty;
          isPointerDown = true;
          if (appMode === 'showcase') {
            tryBeginMokhnatkaDrag(tx, ty);
          }
        }
      }, { passive: false });

      dom.addEventListener('touchmove', e => {
        if (e.touches.length === 0) return;
        const cx = e.touches[0].clientX;
        const cy = e.touches[0].clientY;

        if (appMode === 'game') {
          if (swipeStart && !swipeConsumed) {
            const dx = cx - swipeStart.x;
            const dy = cy - swipeStart.y;
            if (Math.hypot(dx, dy) > 24) {
              swipeConsumed = true; // Lock this gesture so one swipe never fires multiple times!
              if (Math.abs(dx) > Math.abs(dy)) {
                handleRelativeTurn(dx < 0 ? -1 : 1);
              } else {
                handleRelativeTurn(dy < 0 ? 0 : 2);
              }
            }
          }
        } else if (appMode === 'showcase' && isPointerDown) {
          if (draggedMokhnatka) {
            updateMokhnatkaDrag(cx, cy);
          } else {
            const dx = cx - prevPointer.x;
            const dy = cy - prevPointer.y;
            prevPointer.x = cx;
            prevPointer.y = cy;
            orbitYaw -= dx * 0.007;
            orbitPitch = Math.max(0.05, Math.min(1.15, orbitPitch + dy * 0.006));
          }
        }
      }, { passive: false });

      dom.addEventListener('touchend', () => {
        endMokhnatkaDrag();
        swipeStart = null;
        swipeConsumed = false;
        isPointerDown = false;
      });

      dom.addEventListener('touchcancel', () => {
        endMokhnatkaDrag();
        swipeStart = null;
        swipeConsumed = false;
        isPointerDown = false;
      });

      // Mouse Pointer Swipe (Game Mode), Physics Drag & Throw / Orbit (Showcase Mode)
      dom.addEventListener('pointerdown', e => {
        if (e.pointerType === 'touch') return;
        if (appMode === 'game') syncBgMusic();
        isPointerDown = true;
        swipeStart = { x: e.clientX, y: e.clientY };
        swipeConsumed = false;
        prevPointer.x = e.clientX;
        prevPointer.y = e.clientY;
        if (appMode === 'showcase') {
          tryBeginMokhnatkaDrag(e.clientX, e.clientY);
        }
      });

      window.addEventListener('pointermove', e => {
        if (e.pointerType === 'touch' || !isPointerDown) return;
        if (appMode === 'game') {
          if (swipeStart && !swipeConsumed) {
            const dx = e.clientX - swipeStart.x;
            const dy = e.clientY - swipeStart.y;
            if (Math.hypot(dx, dy) > 28) {
              swipeConsumed = true; // Strictly one turn per mouse swipe
              if (Math.abs(dx) > Math.abs(dy)) {
                handleRelativeTurn(dx < 0 ? -1 : 1);
              } else {
                handleRelativeTurn(dy < 0 ? 0 : 2);
              }
            }
          }
        } else if (appMode === 'showcase') {
          if (draggedMokhnatka) {
            updateMokhnatkaDrag(e.clientX, e.clientY);
          } else {
            const dx = e.clientX - prevPointer.x;
            const dy = e.clientY - prevPointer.y;
            prevPointer.x = e.clientX;
            prevPointer.y = e.clientY;
            orbitYaw -= dx * 0.007;
            orbitPitch = Math.max(0.05, Math.min(1.15, orbitPitch + dy * 0.006));
          }
        }
      });

      window.addEventListener('pointerup', e => {
        if (e.pointerType === 'touch') return;
        endMokhnatkaDrag();
        isPointerDown = false;
        swipeStart = null;
        swipeConsumed = false;
      });

      dom.addEventListener('wheel', e => {
        if (appMode !== 'showcase') return;
        orbitDistance = Math.max(4.0, Math.min(32.0, orbitDistance + e.deltaY * 0.008));
      }, { passive: true });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    // ============================================================================
    // MAIN ANIMATION LOOP
    // ============================================================================
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.getElapsedTime();



      if (appMode === 'game') {
        if (gameState.invulnerableTimer > 0) {
          gameState.invulnerableTimer = Math.max(0, gameState.invulnerableTimer - dt);
        }
        if (gameState.powerTimer > 0) {
          gameState.powerTimer = Math.max(0, gameState.powerTimer - dt);
        }

        powerPellets.forEach((p, idx) => {
          if (p.active && p.group) {
            p.group.rotation.y = elapsed * 2.2 + idx;
            const pulse = 1.0 + Math.sin(elapsed * 5.0 + idx) * 0.1;
            p.group.scale.setScalar(pulse);
          }
        });

        if (portalGroup && portalGroup.visible) {
          portalGroup.rotation.y = elapsed * 1.8;
          portalGroup.children[0].rotation.z = elapsed * 2.5;
          portalGroup.children[1].rotation.x = -elapsed * 3.1;
        }

        if (cornerInstancedMesh) { cornerInstancedMesh.position.y = Math.sin(elapsed * 3.2) * 0.06; }
        updateWormMovement(dt, elapsed);
        updateMokhnatkasAI(dt, elapsed);

        // Much Further Back & Higher Wide-Angle Chase Camera Following Worm's Heading
        const headPos = wormEntity.segments[0].position;
        const headAngle = wormEntity.pathPoints[0].angle;
        const forwardX = Math.sin(headAngle);
        const forwardZ = Math.cos(headAngle);

        const desiredCamPos = new THREE.Vector3(
          headPos.x - forwardX * 16.5,
          23.5,
          headPos.z - forwardZ * 16.5
        );
        const desiredLookAt = new THREE.Vector3(
          headPos.x + forwardX * 3.5,
          0.2,
          headPos.z + forwardZ * 3.5
        );

        smoothedCamPos.lerp(desiredCamPos, Math.min(1, dt * 6.0));
        smoothedLookAt.lerp(desiredLookAt, Math.min(1, dt * 8.0));
        camera.position.copy(smoothedCamPos);
        camera.lookAt(smoothedLookAt);

        drawPacMinimap(elapsed);

      } else if (appMode === 'victory') {
        // EPIC WIDE VICTORY FLYBY PAST GIANT GREY 3D METAL TEXT "Glist 2"
        gameState.victoryTimer += dt;
        const t = gameState.victoryTimer;

        // Animate glinting spotlights across the metallic letters
        if (victoryGroup.userData.spot1) {
          victoryGroup.userData.spot1.position.x = Math.sin(elapsed * 1.8) * 14.0;
          victoryGroup.userData.spot2.position.x = Math.cos(elapsed * 1.4) * 14.0;
        }

        // Scroll 3D Credits upward BEHIND the giant "Glist 2" metal inscription
        if (victoryGroup.userData.creditsMesh) {
          victoryGroup.userData.creditsMesh.position.y += dt * 2.45;
          if (victoryGroup.userData.creditsMesh.position.y > 42.0) {
            victoryGroup.userData.creditsMesh.position.y = -26.0;
          }
        }

        // Joyful celebration bounce of Mokhnatkas and worm on the ground
        mokhnatkaEntities.forEach((m, idx) => {
          m.root.position.y = Math.abs(Math.sin(elapsed * 5.5 + idx)) * 0.45;
          m.root.rotation.y = Math.sin(elapsed * 2.0 + idx) * 0.4;
        });
        positionWormAlongPath(elapsed);

        // Phase 1 (0..5.0s): Wide cinematic flyby sweeping from left ("G") to right ("2") far back so the whole "Glist 2" monument is visible
        // Phase 2 (5.0s+): Grand wide panoramic shot orbiting slowly far in front of "Glist 2" with credits rising behind it
        const aspect = window.innerWidth / Math.max(1, window.innerHeight);
        const aspectPullback = aspect < 1.35 ? (1.35 - aspect) * 24.0 : 0.0;
        let desiredCam, desiredLook;
        if (t < 5.0) {
          const p = t / 5.0;
          const ease = p * p * (3 - 2 * p);
          desiredCam = new THREE.Vector3(
            -28.0 + ease * 56.0,
            12.5 + Math.sin(p * Math.PI) * 4.5,
            (48.0 + aspectPullback) + Math.sin(p * Math.PI) * 6.0
          );
          desiredLook = new THREE.Vector3(
            -4.0 + ease * 8.0,
            5.2,
            0.0
          );
        } else {
          const sway = Math.sin((t - 5.0) * 0.45);
          desiredCam = new THREE.Vector3(
            sway * 14.0,
            12.5 + Math.cos((t - 5.0) * 0.35) * 1.6,
            52.0 + aspectPullback
          );
          desiredLook = new THREE.Vector3(0.0, 5.8, 0.0);
        }

        smoothedCamPos.lerp(desiredCam, Math.min(1, dt * 3.2));
        smoothedLookAt.lerp(desiredLook, Math.min(1, dt * 4.0));
        camera.position.copy(smoothedCamPos);
        camera.lookAt(smoothedLookAt);

      } else if (appMode === 'showcase') {
        if (gameState.blinkTimer > 0) {
          gameState.blinkTimer = Math.max(0, gameState.blinkTimer - dt);
        }

        updateShowcasePhysics(dt, elapsed);

        mokhnatkaEntities.forEach((m, idx) => {
          const breathe = Math.sin(elapsed * 2.5 + idx) * 0.04;
          m.bodyGroup.position.y = (m.config.bodyCenterY || 1.05) + breathe;
          const eyeScaleY = gameState.blinkTimer > 0 ? 0.1 : 1.0;
          m.eyeMeshes.forEach(em => { em.scale.y = eyeScaleY; });
        });

        positionWormAlongPath(elapsed);

        let targetCenter = new THREE.Vector3(0, 1.1, 0.8);
        if (showcaseTarget === 'worm') targetCenter.set(0.2, 0.65, 2.3);
        if (showcaseTarget === 'forest') targetCenter.copy(mokhnatkaEntities[0].root.position).add(new THREE.Vector3(0, 1.2, 0));
        if (showcaseTarget === 'moss') targetCenter.copy(mokhnatkaEntities[1].root.position).add(new THREE.Vector3(0, 1.2, 0));
        if (showcaseTarget === 'crimson') targetCenter.copy(mokhnatkaEntities[2].root.position).add(new THREE.Vector3(0, 1.2, 0));

        const camX = targetCenter.x + Math.sin(orbitYaw) * Math.cos(orbitPitch) * orbitDistance;
        const camY = Math.max(0.5, targetCenter.y + Math.sin(orbitPitch) * orbitDistance);
        const camZ = targetCenter.z + Math.cos(orbitYaw) * Math.cos(orbitPitch) * orbitDistance;

        smoothedCamPos.lerp(new THREE.Vector3(camX, camY, camZ), Math.min(1, dt * 7.0));
        smoothedLookAt.lerp(targetCenter, Math.min(1, dt * 7.0));
        camera.position.copy(smoothedCamPos);
        camera.lookAt(smoothedLookAt);
      }

      renderer.render(scene, camera);
    }

    ensureThreeLoaded().then(() => {
      if (window.THREE) {
        initScene();
      }
    });
  </script>
</body>
</html>
