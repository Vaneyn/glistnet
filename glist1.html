<script>
setTimeout(function() {
    // Генерируем случайное число от 0 до 99
    var chance = Math.floor(Math.random() * 25);

    // Если шанс +
    if (chance === 1) {
        // Создаем элемент для изображения
        var img = document.createElement('img');
        img.src = getRandomImage(); // Получаем случайное изображение
        img.style.width = '256px';
        img.style.height = '256px';
        img.style.position = 'fixed';
        img.style.top = '0';
        img.style.left = '0';
        img.style.zIndex = '9999';

        // Добавляем изображение в тело документа
        document.body.appendChild(img);

        // Создаем аудио элемент
        var audio = new Audio('ha.mp3');
        audio.play(); // Воспроизводим звук

        // Когда звук закончится, скрываем изображение
        audio.onended = function() {
            document.body.removeChild(img);
        };
    }
}, 500);

function getRandomImage() {
    // Массив доступных изображений
    var images = ['a.jpg', 'b.jpg', 'c.jpg', 'd.jpg', 'e.jpg', 'hdd.jpg'];
    // Генерируем случайный индекс из массива
    var randomIndex = Math.floor(Math.random() * images.length);
    // Возвращаем случайное изображение из массива
    return images[randomIndex];
}

</script>

 <script>

<script>
// Создаем боковое меню
function createSideMenu() {
  // Создаем контейнер для бокового меню
  var sideMenu = document.createElement('div');
  sideMenu.id = 'sideMenu';
  sideMenu.style.width = '200px';
  sideMenu.style.height = '100%';
  sideMenu.style.position = 'fixed';
  sideMenu.style.top = '0';
  sideMenu.style.left = '-200px';
  sideMenu.style.backgroundColor = 'white';
  sideMenu.style.transition = 'left 0.3s ease-in';

  // Создаем список элементов меню
  var menuItems = [
    { name: 'gazeta', label: 'Новости' },
    { name: 'terminal', label: 'Терминал' },
    { name: 'dostig', label: 'Достижения' },
    { name: 'saver', label: 'Экспорт / Импорт данных' },
  { name: 'tool9', label: 'Помощь (Памагити)' },
{ name: 'settings', label: 'Настройки' }
  ];

  // Добавляем кнопки меню в контейнер
  for (var i = 0; i < menuItems.length; i++) {
    var menuItem = document.createElement('button');
    menuItem.style.display = 'block';
    menuItem.style.width = '100%';
    menuItem.style.padding = '10px';
    menuItem.textContent = menuItems[i].label;
    menuItem.setAttribute('onclick', 'runTool("' + menuItems[i].name + '")');
    sideMenu.appendChild(menuItem);
  }

  // Добавляем боковое меню в тело документа
  document.body.appendChild(sideMenu);

  // Обработчик клика для открытия/закрытия бокового меню
  document.addEventListener('click', function(event) {
    var target = event.target;
    if (target.id === 'menuButton') {
      sideMenu.style.left = (sideMenu.style.left === '-200px') ? '0' : '-200px';
    }
  });
}

// Создаем кнопку для открытия/закрытия бокового меню
function createMenuButton() {
  var menuButton = document.createElement('button');
  menuButton.id = 'menuButton';
  menuButton.textContent = 'Menu';
  menuButton.style.position = 'fixed';
  menuButton.style.top = '10px';
  menuButton.style.left = '250px';
  document.body.appendChild(menuButton);
}


// Вызываем функции для создания бокового меню и кнопки
createSideMenu();
createMenuButton();

</script>
