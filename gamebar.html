<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игровое меню GList</title>
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a2530, #2c3e50);
            color: #ecf0f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-y: auto;
            line-height: 1.6;
        }
        
        h1 {
            margin: 20px 0;
            font-size: 2.2rem;
            text-align: center;
            position: relative;
            padding-bottom: 15px;
            letter-spacing: 1px;
            font-weight: 700;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }
        
        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #3498db, transparent);
            border-radius: 2px;
        }
        
        .menu {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            max-width: 800px;
            width: 100%;
            background: rgba(30, 40, 56, 0.8);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .button {
            padding: 16px 20px;
            margin: 0;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            color: #ecf0f1;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            flex: 1 1 180px;
            min-width: 140px;
            max-width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, #2980b9, #2c3e50);
            border: 1px solid rgba(52, 152, 219, 0.3);
        }
        
        .button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(41, 128, 185, 0.4);
            background: linear-gradient(135deg, #2c3e50, #2980b9);
        }
        
        .back-button {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border-radius: 50px;
            padding: 14px 30px;
            font-size: 1.1rem;
            margin-top: 15px;
            flex-basis: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid rgba(231, 76, 60, 0.3);
        }
        
        .back-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(231, 76, 60, 0.4);
            background: linear-gradient(135deg, #c0392b, #e74c3c);
        }
        
        /* Адаптивность */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .menu {
                padding: 20px 15px;
                border-radius: 12px;
                max-width: 95%;
                gap: 12px;
            }
            
            .button {
                padding: 14px 10px;
                font-size: 0.95rem;
                min-width: 130px;
                flex-basis: calc(50% - 6px);
            }
            
            .back-button {
                padding: 12px 20px;
                font-size: 1rem;
            }
        }
        
        @media (max-width: 400px) {
            .button {
                flex-basis: 100%;
            }
        }
        
        .info-box {
            max-width: 800px;
            width: 100%;
            background: rgba(30, 40, 56, 0.8);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .info-box h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #3498db;
            text-align: center;
        }
        
        .info-box ul {
            padding-left: 20px;
            margin-bottom: 15px;
        }
        
        .info-box li {
            margin-bottom: 8px;
        }
        
        .features {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
        }
        
        .feature {
            flex: 1 1 200px;
            background: rgba(41, 128, 185, 0.15);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(52, 152, 219, 0.2);
        }
        
        .feature h3 {
            color: #3498db;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }
    </style>

</head>
<body>
    <h1>Игровое меню GList</h1>
    <div class="menu">

   <button class="button back-button" onclick="goBack()">Назад</button>


        <button class="button game-button" onclick="openFile('tool15.html')">Палковая игра</button>
        <button class="button game-button" onclick="openFile('subway.html')">3D subway</button>
        <button class="button game-button" onclick="openFile('pistoletmenu.html')">Дуель</button>
        <button class="button game-button" onclick="openFile('govmenu.html')">Государство</button>
        <button class="button game-button" onclick="openFile('2048.html')">2048</button>
        <button class="button game-button" onclick="openFile('territorymenu.html')">Захват клеток</button>
        <button class="button game-button" onclick="openFile('clskgame.html')">Сапёр</button>
        <button class="button game-button" onclick="openFile('HS.html')">Hungry Glist</button>
        <button class="button game-button" onclick="openFile('tankmenu.html')">Танчики</button>
      <button class="button game-button" onclick="openFile('rr.html')">Русская рулетка</button>

      <button class="button game-button" onclick="openFile('pvz.html')">Растения против зомби</button>
     <button class="button game-button" onclick="openFile('fightio.html')">Средневековый бой</button>
       <button class="button game-button" onclick="openFile('gamereaction.html')">Реакция</button>
      <button class="button game-button" onclick="openFile('ballgame.html')">Отбивайка</button>
   
  <button class="button game-button" onclick="openFile('doodle.html')">Дудл Глист</button>
 <button class="button game-button" onclick="openFile('hvat.html')">Перехват 2p</button>
 <button class="button game-button" onclick="openFile('avgame.html')">Толпа Артемов</button>
   
 <button class="button game-button" onclick="openFile('blockblast.html')">Блок Бласт Глист</button>
 <button class="button game-button" onclick="openFile('tog.html')">Tomb of the glist</button>
 <button class="button game-button" onclick="openFile('nozik.html')">Ножики в пень</button>
 <button class="button game-button" onclick="openFile('smashhit.html')">Смашхит</button>
 
 <button class="button game-button" onclick="openFile('WW1.html')">Битва за зоны WW1</button>


  
    </div>

    <script>
        function openFile(filename) {
            window.open(filename, '_self');
        }
        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
