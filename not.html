        function sendNotification() {
            var randomIndex = Math.floor(Math.random() * phrases.length);
            var message = phrases[randomIndex];

            // Создание уведомления
            var notify = app.CreateNotification();
            notify.SetMessage("Ticker", "", message);
            notify.Notify("testID");

            // Устанавливаем случайный интервал от 1 до 500 секунд
            var nextInterval = Math.floor(Math.random() * 500000) + 1000;
            setTimeout(sendNotification, nextInterval);
        }

        function OnStart() {
            app.ShowPopup("Папёрли :)");
            sendNotification(); // Первое уведомление сразу
