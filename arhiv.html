// Инициализация IndexedDB
function initDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open("AchievementsDB", 1);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve(request.result);
        request.onupgradeneeded = (event) => {
            const db = event.target.result;
            db.createObjectStore("achievements", { keyPath: "title" });
        };
    });
}

// Добавление достижения и показ уведомления
async function addAchievement(title, text, image = false) {
    try {
        const db = await initDB();
        const transaction = db.transaction(["achievements"], "readwrite");
        const objectStore = transaction.objectStore("achievements");

        const checkRequest = objectStore.get(title);

        return new Promise((resolve) => {
            checkRequest.onsuccess = () => {
                if (!checkRequest.result) {
                    const newAchievement = { title, text, image: image || "button.png" };
                    objectStore.add(newAchievement).onsuccess = () => {
                        const div = document.createElement("div");
                        div.textContent = title;
                        div.style.position = "fixed";
                        div.style.top = "15px";
                        div.style.left = "5%";
                        div.style.width = "90%";
                        div.style.background = "#ffd700";
                        div.style.color = "#1a1a1a";
                        div.style.padding = "10px";
                        div.style.borderRadius = "8px";
                        div.style.boxShadow = "0 3px 10px rgba(0, 0, 0, 0.3)";
                        div.style.zIndex = "1000";
                        document.body.appendChild(div);
                        setTimeout(() => div.remove(), 3000);
                        resolve(true);
                    };
                } else {
                    resolve(false);
                }
            };
        });
    } catch (error) {
        console.error("Error:", error);
        return false;
    }
}

// Проверка и добавление достижения
async function checkAndAddAchievement() {
    if (1>= 1) {
        const added = await addAchievement(
            "Археолог",

            "arhiv.png"
        );
        if (added) console.log("Достижение добавлено!");
    }
}
