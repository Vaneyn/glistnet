<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>QR Генератор</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
      background-color: #f3f3f3;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    input {
      width: 90%;
      max-width: 300px;
      padding: 10px;
      margin: 10px 0;
      font-size: 16px;
      background: #e0e0e0;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    button {
      padding: 10px 16px;
      margin: 6px;
      font-size: 15px;
      background: #666;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    #qrcode {
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <input type="text" id="qrInput" placeholder="Введите текст">
  <div>
    <button onclick="generateQR()">Сгенерировать</button>
    <button onclick="copyQR()">Копировать</button>
    <button onclick="location.href='glist.html'">Назад</button>
  </div>
  <div id="qrcode"></div>

  <script src="qr.txt"></script>
  <script>
    let qr;

    function generateQR() {
      const text = document.getElementById('qrInput').value.trim();
      const container = document.getElementById('qrcode');
      container.innerHTML = '';
      if (!text) return;
      qr = new QRCode(container, {
        text: text,
        width: 333,
        height: 333,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }

    function copyQR() {
      const img = document.querySelector('#qrcode img');
      if (!img) return alert("Сначала сгенерируйте QR-код");
      fetch(img.src)
        .then(res => res.blob())
        .then(blob => {
          const item = new ClipboardItem({ 'image/png': blob });
          navigator.clipboard.write([item]).then(() => {
            alert('QR-код скопирован!');
          }).catch(() => {
            alert('Не удалось скопировать.');
          });
        });
    }
  </script>

</body>
</html>
