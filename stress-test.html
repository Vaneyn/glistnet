  <body>
    <h1>Тестирование запросов на сервер</h1>
    <label for="url">URL-адрес:</label>
    <input type="text" id="url" name="url"><br><br>
    <button onclick="testRequests()">Тестировать</button>

		function runTool(toolName) {

    <script>
    
      function testRequests() {
        const url = document.getElementById("url").value;
        const requests = [
          { type: "GET", url },
          { type: "POST", url },
          { type: "HEAD", url },
          { type: "OPTIONS", url },
        ];

        const results = [];
        let completedRequests = 0;
        let totalResponseTime = 0;

        for (let i = 0; i < 10; i++) {
          requests.forEach((request) => {
            const startTime = Date.now();
            fetch(url, { method: request.type })
              .then((response) => {
                const responseTime = Date.now() - startTime;
                results.push({ type: request.type, responseTime });
                totalResponseTime += responseTime;
                completedRequests++;
                if (completedRequests === requests.length * 10) {
                  const averageResponseTime = totalResponseTime / results.length;
                  let fastestRequestType = "";
                  let fastestRatio = 0;
                  results.forEach((result) => {
                    const ratio = result.responseTime / averageResponseTime;
                    if (ratio > fastestRatio) {
                      fastestRequestType = result.type;
                      fastestRatio = ratio;
                    }
                  });
                  const output = `Среднее время ответа: ${averageResponseTime} мс.<br>
                      Тип запроса с наибольшим отношением скорости обработки к скорости отправки: <span style="color: red">${fastestRequestType}</span><br>
                      Текущая скорость отправки пакетов: ${Math.round((completedRequests / (requests.length * 10 * 0.1)) * 10) / 10} в секунду`;
                  document.getElementById("results").innerHTML = output;
                }
              })
              .catch((error) => {
                completedRequests++;
                if (completedRequests === requests.length * 10) {
                  const averageResponseTime = totalResponseTime / results.length;
                  let fastestRequestType= "";
                  let fastestRatio = 0;
                  results.forEach((result) => {
                    const ratio = result.responseTime / averageResponseTime;
                    if (ratio > fastestRatio) {
                      fastestRequestType = result.type;
                      fastestRatio = ratio;
                    }
                  });
                  const output = `Среднее время ответа: ${averageResponseTime} мс.<br>
                      Тип запроса с наибольшим отношением скорости обработки к скорости отправки: <span style="color: red">${fastestRequestType}</span><br>
                      Текущая скорость отправки пакетов: ${Math.round((completedRequests / (requests.length * 10 * 0.1)) * 10) / 10} в секунду`;
                  document.getElementById("results").innerHTML = output;
                }
              });
          });
        }
      }

function testMethod() {
  const url = document.getElementById("url").value;

setInterval(() => {

    });
}, 1300);

  setInterval(() => {
    count++;
    const img = new Image();

  }, 0); // 0.5 миллисекунды между отправками запросов

  setInterval(() => {

}
