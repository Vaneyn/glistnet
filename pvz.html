<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Plants vs Zombies – 10 Уровней (Procedural HD + Mobile WebView)</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #1e241b;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
      overflow: hidden;
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      touch-action: none;
    }

    /* Верхняя панель управления */
    #topControls {
      position: fixed;
      top: 6px;
      right: 8px;
      z-index: 1000;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
    }

    .hud-btn {
      margin-left: 6px;
      padding: 6px 11px;
      background: #384531;
      background: -webkit-linear-gradient(top, #44523d, #2b3527);
      background: linear-gradient(180deg, #44523d, #2b3527);
      color: #f0f4ec;
      border: 2px solid #6c8062;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 3px 8px rgba(0,0,0,0.45);
    }

    .hud-btn:active {
      -webkit-transform: translateY(1px);
      transform: translateY(1px);
    }

    .hud-btn.active-speed {
      border-color: #ffd700;
      color: #ffd700;
    }

    /* Основной контейнер */
    #gameContainer {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      width: 100%;
      height: 100%;
    }

    /* Боковое меню с карточками растений */
    #sidebar {
      width: 82px;
      min-width: 82px;
      background: #2f1f14;
      background: -webkit-linear-gradient(top, #3a2618 0%, #24170e 100%);
      background: linear-gradient(180deg, #3a2618 0%, #24170e 100%);
      border-right: 3px solid #5c3d28;
      box-shadow: 4px 0 12px rgba(0,0,0,0.5);
      padding: 6px 5px;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -webkit-flex-direction: column;
      flex-direction: column;
      overflow-y: auto;
      overflow-x: hidden;
      z-index: 10;
      -webkit-overflow-scrolling: touch;
    }

    .plant-option {
      position: relative;
      background: #b5a486;
      background: -webkit-linear-gradient(top, #c8b89a 0%, #9b8869 100%);
      background: linear-gradient(180deg, #c8b89a 0%, #9b8869 100%);
      border: 2px solid #54442f;
      border-radius: 7px;
      padding: 3px 2px 2px;
      margin-bottom: 5px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.4);
      overflow: hidden;
      flex-shrink: 0;
    }

    .plant-option.selected {
      background: #f5df80;
      background: -webkit-linear-gradient(top, #fff3b0 0%, #e6c55a 100%);
      background: linear-gradient(180deg, #fff3b0 0%, #e6c55a 100%);
      border-color: #ffae00;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
    }

    .plant-option.disabled {
      opacity: 0.52;
    }

    .plant-option.locked {
      display: none;
    }

    .plant-option[data-type="shovel"] {
      margin-top: auto;
      margin-bottom: 0;
      background: #525e6b;
      background: -webkit-linear-gradient(top, #687685 0%, #3d4752 100%);
      background: linear-gradient(180deg, #687685 0%, #3d4752 100%);
      border-color: #90a0b0;
    }

    .plant-option[data-type="shovel"].selected {
      background: #e06040;
      border-color: #ffddcc;
    }

    .plant-option canvas {
      width: 44px;
      height: 44px;
      display: block;
      margin: 0 auto;
    }

    .plant-option .cost-badge {
      display: inline-block;
      width: 94%;
      background: rgba(25, 18, 10, 0.85);
      color: #ffd700;
      font-size: 10px;
      font-weight: 800;
      border-radius: 4px;
      padding: 1px 0;
      margin-top: 1px;
    }

    .plant-option .key-hint {
      position: absolute;
      top: 1px;
      left: 3px;
      font-size: 8px;
      font-weight: 800;
      color: rgba(0,0,0,0.55);
      z-index: 2;
    }

    /* Шторка перезарядки карточки (Кулдаун) */
    .cd-overlay {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 0%;
      background: rgba(10, 14, 10, 0.72);
      pointer-events: none;
      z-index: 3;
      border-top: 1px solid rgba(255, 255, 255, 0.35);
    }

    /* Игровая область */
    #gameArea {
      -webkit-box-flex: 1;
      -webkit-flex: 1;
      flex: 1;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -webkit-flex-direction: column;
      flex-direction: column;
      position: relative;
      background: #2d4c1e;
      overflow: hidden;
    }

    #gameCanvas {
      -webkit-box-flex: 1;
      -webkit-flex: 1;
      flex: 1;
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    /* Нижняя панель (Баланс + Прогресс-бар + Уровень) */
    #bottomHUD {
      height: 56px;
      min-height: 56px;
      background: #232c20;
      background: -webkit-linear-gradient(top, #2d3829 0%, #1b2218 100%);
      background: linear-gradient(180deg, #2d3829 0%, #1b2218 100%);
      border-top: 3px solid #4d6145;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: justify;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      padding: 0 12px;
      color: #fff;
      z-index: 10;
    }

    #balanceContainer {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.45);
      border: 2px solid #8a7020;
      border-radius: 24px;
      padding: 3px 14px 3px 8px;
      margin-right: 12px;
      min-width: 125px;
    }

    #sunIconHUD {
      width: 28px;
      height: 28px;
      margin-right: 7px;
      flex-shrink: 0;
    }

    .sun-label {
      font-size: 10px;
      color: #cbd5c0;
      text-transform: uppercase;
      font-weight: 700;
      display: block;
      line-height: 1;
    }

    #sunCount {
      font-size: 19px;
      font-weight: 900;
      color: #ffe14d;
      line-height: 1.1;
    }

    /* Прогресс-бар уровня */
    #progressWrapper {
      -webkit-box-flex: 1;
      -webkit-flex: 1;
      flex: 1;
      max-width: 650px;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-box-direction: normal;
      -webkit-flex-direction: column;
      flex-direction: column;
    }

    #progressHeader {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-pack: justify;
      -webkit-justify-content: space-between;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: #d5e2ce;
      margin-bottom: 4px;
    }

    #progressContainer {
      height: 18px;
      background: #141a12;
      border: 2px solid #596e50;
      border-radius: 10px;
      position: relative;
      overflow: visible;
    }

    #progressBar {
      height: 100%;
      width: 0%;
      background: #52b788;
      background: -webkit-linear-gradient(left, #52b788 0%, #ffd166 75%, #ef476f 100%);
      background: linear-gradient(90deg, #52b788 0%, #ffd166 75%, #ef476f 100%);
      border-radius: 8px;
      -webkit-transition: width 0.15s linear;
      transition: width 0.15s linear;
    }

    .progressMarker {
      position: absolute;
      top: -3px;
      bottom: -3px;
      width: 3px;
      background: #ff3333;
      z-index: 3;
    }

    .progressMarker::after {
      content: attr(data-label);
      position: absolute;
      top: -13px;
      left: 50%;
      -webkit-transform: translateX(-50%);
      transform: translateX(-50%);
      font-size: 9px;
      font-weight: 800;
      color: #ff9999;
      white-space: nowrap;
      text-shadow: 0 1px 2px #000;
    }

    /* Модальное окно выбора уровней (1 - 10) */
    #levelModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 14, 9, 0.86);
      z-index: 2000;
      display: none;
      -webkit-box-align: center;
      -webkit-align-items: center;
      align-items: center;
      -webkit-box-pack: center;
      -webkit-justify-content: center;
      justify-content: center;
      padding: 12px;
    }

    #levelModal.open {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
    }

    .modal-box {
      background: #283323;
      border: 3px solid #6c8062;
      border-radius: 14px;
      max-width: 540px;
      width: 100%;
      max-height: 90%;
      overflow-y: auto;
      padding: 16px;
      color: #f0f4ec;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    .modal-title {
      margin: 0 0 6px;
      font-size: 20px;
      color: #ffd700;
      text-align: center;
    }

    .modal-sub {
      margin: 0 0 14px;
      font-size: 12px;
      color: #b8c9b0;
      text-align: center;
    }

    .level-grid {
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-flex-wrap: wrap;
      flex-wrap: wrap;
      margin: -4px;
    }

    .lvl-btn {
      width: calc(20% - 8px);
      margin: 4px;
      padding: 8px 4px;
      background: #3d4d36;
      border: 2px solid #758f68;
      border-radius: 8px;
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }

    .lvl-btn.current {
      background: #6c8c32;
      border-color: #ffd700;
      color: #ffd700;
    }

    .lvl-btn.locked-lvl {
      background: #1f261c;
      border-color: #3a4535;
      color: #677362;
      cursor: not-allowed;
    }

    .lvl-btn small {
      display: block;
      font-size: 9px;
      font-weight: 600;
      color: #d0dfd0;
      margin-top: 2px;
    }

    .modal-actions {
      margin-top: 14px;
      display: -webkit-box;
      display: -webkit-flex;
      display: flex;
      -webkit-box-pack: justify;
      -webkit-justify-content: space-between;
      justify-content: space-between;
    }

    /* Адаптация под узкие экраны и мобильные телефоны */
    @media (max-width: 700px), (max-height: 460px) {
      #sidebar {
        width: 66px;
        min-width: 66px;
        padding: 4px 3px;
      }
      .plant-option {
        padding: 2px 1px;
        margin-bottom: 4px;
      }
      .plant-option canvas {
        width: 34px;
        height: 34px;
      }
      .plant-option .cost-badge {
        font-size: 9px;
      }
      #bottomHUD {
        height: 44px;
        min-height: 44px;
        padding: 0 8px;
      }
      #balanceContainer {
        min-width: 96px;
        padding: 2px 10px 2px 6px;
      }
      #sunCount {
        font-size: 15px;
      }
      .hud-btn {
        padding: 4px 8px;
        font-size: 11px;
      }
      .lvl-btn {
        width: calc(33.33% - 8px);
      }
    }
  </style>
</head>
<body>

  <!-- Верхние кнопки управления -->
  <div id="topControls">
    <button class="hud-btn" id="levelSelectBtn" title="Выбрать уровень">🏆 Ур. <span id="hudLevelNum">1</span>/10</button>
    <button class="hud-btn" id="speedBtn" title="Ускорить время">1x</button>
    <button class="hud-btn" id="pauseBtn" title="Пауза">⏸</button>
    <button class="hud-btn" id="backButton" onclick="location.href='glist.html'">⬅ Назад</button>
  </div>

  <!-- Модальное окно кампании (10 уровней) -->
  <div id="levelModal">
    <div class="modal-box">
      <h2 class="modal-title">КАМПАНИЯ: ЗАЩИТА ГАЗОНА</h2>
      <p class="modal-sub">Прогресс автоматически сохраняется в LocalStorage (ключ: <b>PvZ level</b>)</p>
      <div class="level-grid" id="levelGrid"></div>
      <div class="modal-actions">
        <button class="hud-btn" id="resetProgressBtn" style="border-color:#c0392b;color:#ffb8b8;">Сбросить прогресс</button>
        <button class="hud-btn" id="closeModalBtn">Продолжить игру</button>
      </div>
    </div>
  </div>

  <div id="gameContainer">
    <!-- Боковая панель выбора растений -->
    <div id="sidebar">
      <div class="plant-option" data-type="sunflower" title="Подсолнух: даёт 25 солнца">
        <span class="key-hint">1</span>
        <canvas width="48" height="48" id="opt-sunflower"></canvas>
        <span class="cost-badge">50 ☀</span>
        <div class="cd-overlay" id="cd-sunflower"></div>
      </div>

        <span class="cost-badge">100 ☀</span>

      </div>
      <div class="plant-option" data-type="walnut" title="Стена-орех: крепкая броня">
        <span class="key-hint">3</span>
        <canvas width="48" height="48" id="opt-walnut"></canvas>
        <span class="cost-badge">50 ☀</span>
        <div class="cd-overlay" id="cd-walnut"></div>
      </div>
      <div class="plant-option" data-type="potatomine" title="Картофельная мина: взрывается после зарядки (Ур. 2)">
        <span class="key-hint">4</span>
        <canvas width="48" height="48" id="opt-potatomine"></canvas>
        <span class="cost-badge">25 ☀</span>
        <div class="cd-overlay" id="cd-potatomine"></div>
      </div>
      <div class="plant-option" data-type="snowpea" title="Морозный горох: замедляет зомби на 50% (Ур. 3)">
        <span class="key-hint">5</span>
        <canvas width="48" height="48" id="opt-snowpea"></canvas>
        <span class="cost-badge">150 ☀</span>
        <div class="cd-overlay" id="cd-snowpea"></div>
      </div>
      <div class="plant-option" data-type="boxercabbage" title="Капуста-боксёр: быстрые удары на 2 клетки (Ур. 4)">
        <span class="key-hint">6</span>
        <canvas width="48" height="48" id="opt-boxercabbage"></canvas>
        <span class="cost-badge">125 ☀</span>
        <div class="cd-overlay" id="cd-boxercabbage"></div>
      </div>
      <div class="plant-option" data-type="cherrybomb" title="Вишнёвая бомба: взрыв 3x3 клетки (Ур. 5)">
        <span class="key-hint">7</span>
        <canvas width="48" height="48" id="opt-cherrybomb"></canvas>
        <span class="cost-badge">150 ☀</span>
        <div class="cd-overlay" id="cd-cherrybomb"></div>
      </div>
      <div class="plant-option" data-type="repeater" title="Двойной горохострел: выпускает по 2 горошины (Ур. 6)">
        <span class="key-hint">8</span>
        <canvas width="48" height="48" id="opt-repeater"></canvas>
        <span class="cost-badge">200 ☀</span>

      </div>
      <div class="plant-option" data-type="chomper" title="Зубастик: проглатывает зомби целиком (Ур. 8)">

    <!-- Игровое поле и нижний HUD -->
    <div id="gameArea">
      <canvas id="gameCanvas"></canvas>

      <div id="bottomHUD">
        <div id="balanceContainer">
          <canvas id="sunIconHUD" width="28" height="28"></canvas>
          <div>
            <span class="sun-label">Солнца</span>
            <span id="sunCount">50</span>

        <div id="progressWrapper">
          <div id="progressHeader">
            <span id="waveStatusText">Уровень 1</span>
            <span id="timerText">00:00 / 02:00</span>
          </div>

            <div id="progressBar"></div>

          </div>

  <script>
  /**************************************************************
   * 1. ПОЛИФИЛЛЫ ДЛЯ СТАРЫХ ANDROID WEBVIEW
   **************************************************************/
  (function() {
    // Полифилл roundRect для Canvas (отсутствует в WebView < Chrome 99)
    if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        var radius = typeof r === 'number' ? r : (Array.isArray(r) ? (r[0] || 0) : 0);
        if (w < 2 * radius) radius = w / 2;
        if (h < 2 * radius) radius = h / 2;
        if (radius < 0) radius = 0;
        this.moveTo(x + radius, y);
        this.arcTo(x + w, y, x + w, y + h, radius);
        this.arcTo(x + w, y + h, x, y + h, radius);
        this.arcTo(x, y + h, x, y, radius);
        this.arcTo(x, y, x + w, y, radius);
        this.closePath();
        return this;
      };
    }

    // Полифилл performance.now и requestAnimationFrame
    if (!window.performance) window.performance = {};
    if (!window.performance.now) {
      var startOffset = Date.now();
      window.performance.now = function() { return Date.now() - startOffset; };
    }
    window.requestAnimationFrame = window.requestAnimationFrame ||
      window.webkitRequestAnimationFrame ||
      function(cb) { return setTimeout(function() { cb(window.performance.now()); }, 16); };
  })();

  // Безопасная работа с LocalStorage для ключа 'PvZ level'
  var STORAGE_KEY = 'PvZ level';

  function getSavedMaxLevel() {
    try {
      var raw = window.localStorage.getItem(STORAGE_KEY);
      var parsed = parseInt(raw, 10);
      if (!isNaN(parsed) && parsed >= 1 && parsed <= 10) return parsed;
    } catch (e) {}
    return 1;
  }

  function saveMaxLevel(lvl) {
    var clamped = Math.max(1, Math.min(10, parseInt(lvl, 10) || 1));
    try {
      window.localStorage.setItem(STORAGE_KEY, String(clamped));
    } catch (e) {}
  }

  /**************************************************************
   * 2. БАЗА ДАННЫХ РАСТЕНИЙ, ЗОМБИ И КАЛИБРОВКА 10 УРОВНЕЙ
   **************************************************************/
  var GRID_ROWS = 5;
  var GRID_COLS = 9;

  // Характеристики всех 8 растений
  var PLANT_DB = {
    sunflower:    { name: 'Подсолнух',     cost: 50,  hp: 10, cd: 5000,  unlockLevel: 1 },
    peashooter:   { name: 'Горохострел',   cost: 100, hp: 10, cd: 5000,  unlockLevel: 1 },
    walnut:       { name: 'Стена-орех',    cost: 50,  hp: 70, cd: 18000, unlockLevel: 1 },
    potatomine:   { name: 'Картоф. мина',  cost: 25,  hp: 10, cd: 16000, unlockLevel: 2 },
    snowpea:      { name: 'Морозный горох',cost: 150, hp: 10, cd: 6500,  unlockLevel: 3 },
    boxercabbage: { name: 'Капуста-боксёр',cost: 125, hp: 14, cd: 6500,  unlockLevel: 4 },
    cherrybomb:   { name: 'Вишнёвая бомба',cost: 150, hp: 99, cd: 28000, unlockLevel: 5 },
    repeater:     { name: 'Двойной горох', cost: 200, hp: 12, cd: 6500,  unlockLevel: 6 },
    chomper:      { name: 'Зубастик',      cost: 150, hp: 16, cd: 12000, unlockLevel: 8 }
  };

  var ALL_PLANT_TYPES = [
    'sunflower', 'peashooter', 'walnut', 'potatomine',
    'snowpea', 'boxercabbage', 'cherrybomb', 'repeater', 'chomper'
  ];

  // Интервалы способностей растений (мс)
  var sunflowerFirstDelay = 4500;
  var sunflowerInterval = 19000;
  var peashooterInterval = 1150;
  var potatoArmTime = 13500; // Сбалансировано до 13.5 сек
  var boxercabbageInterval = 333;
  var chomperChewTime = 20000;
  var zombieAttackInterval = 500;

  // Характеристики 7 типов зомби
  var ZOMBIE_DB = {
    normal:    { hp: 18,  speed: 1 / 11000 },

  function resizeCanvas() {
    var sidebarEl = document.getElementById('sidebar');
    var bottomEl = document.getElementById('bottomHUD');
    var sidebarW = sidebarEl ? sidebarEl.offsetWidth : 75;
    var bottomH = bottomEl ? bottomEl.offsetHeight : 52;
    var winW = window.innerWidth || document.documentElement.clientWidth || 800;
    var winH = window.innerHeight || document.documentElement.clientHeight || 480;

    canvas.width = Math.max(240, winW - sidebarW);
    canvas.height = Math.max(180, winH - bottomH);

    // Оставляем 0.65 клетки слева под газонокосилки и отступ справа
    var usableW = canvas.width - 16;
    var usableH = canvas.height - 12;
    cellSize = Math.floor(Math.min(usableW / (GRID_COLS + 0.68), usableH / GRID_ROWS));
    if (cellSize < 28) cellSize = 28;

    var totalBoardW = (GRID_COLS + 0.65) * cellSize;
    var totalBoardH = GRID_ROWS * cellSize;
    gridOffsetX = Math.floor((canvas.width - totalBoardW) / 2 + 0.65 * cellSize);
    gridOffsetY = Math.floor((canvas.height - totalBoardH) / 2);
  }

  // Обновление UI карточек, баланса солнца и доступности растений по уровню
  function updateSunDisplay() {
    var sunEl = document.getElementById('sunCount');
    if (sunEl) sunEl.innerText = sunCount;

    var cards = document.querySelectorAll('.plant-option');
    for (var i = 0; i < cards.length; i++) {
      var opt = cards[i];
      var t = opt.getAttribute('data-type');
      if (t === 'shovel') continue;
      var info = PLANT_DB[t];
      if (!info) continue;

      // Открыто ли растение на текущем/максимальном уровне
      var activeLvlNum = Math.max(currentLevelConfig.level, maxUnlockedLevel);
      var isUnlocked = activeLvlNum >= info.unlockLevel;
      if (!isUnlocked) {
        opt.classList.add('locked');
      } else {
        opt.classList.remove('locked');
      }

      var onCooldown = (plantCooldowns[t] || 0) > 0;
      if (sunCount < info.cost || onCooldown) {
        opt.classList.add('disabled');
      } else {
        opt.classList.remove('disabled');
      }
    }
  }

  function updateCooldownOverlays(dt) {
    var changed = false;
    for (var i = 0; i < ALL_PLANT_TYPES.length; i++) {
      var t = ALL_PLANT_TYPES[i];
      if (plantCooldowns[t] > 0) {
        plantCooldowns[t] = Math.max(0, plantCooldowns[t] - dt);
        var cdEl = document.getElementById('cd-' + t);
        if (cdEl) {
          var pct = (plantCooldowns[t] / PLANT_DB[t].cd) * 100;
          cdEl.style.height = pct.toFixed(1) + '%';
        }
        if (plantCooldowns[t] === 0) changed = true;

  }
