<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>GlistPlay — Магазин плагинов</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <style>
    /* ======== БАЗОВЫЕ СТИЛИ ======== */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background: linear-gradient(160deg, #1e1e1e, #333, #444);
      color: #fff;
      min-height: 100vh;
      user-select: none;
      touch-action: manipulation;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
    button {
      font-family: inherit;
      font-size: 1rem;
    }

    /* ======== ХЕДЕР (Главное меню) ======== */
    header#main-header {
      position: sticky;
      top: 0;
      background: rgba(30,30,30,0.95);
      padding: 10px 15px;
      display: flex;
      align-items: center;
      z-index: 10;
      border-bottom: 1px solid #555;
    }
    .back-btn-main {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
      margin-right: 12px;
    }
    header#main-header h1 {
      flex: 1;
      font-size: 1.2rem;
      margin: 0;
    }
    .search-container {
      flex: 2;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 7px 12px;
      background: rgba(255,255,255,0.1);
      border: 1px solid #666;
      border-radius: 25px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    .search-input::placeholder {
      color: #bbb;
    }
    .search-icon {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
      color: #bbb;
      pointer-events: none;
    }

    /* ======== СПИСОК ПЛАГИНОВ ======== */
    #plugin-list {
      display: flex;
      flex-direction: column;
      padding: 10px;
    }
    .plugin-item {
      display: flex;
      align-items: center;
      background: rgba(255,255,255,0.05);
      border: 1px solid #555;
      border-radius: 6px;
      padding: 8px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .plugin-item:hover {
      background: rgba(255,255,255,0.1);
    }
    .plugin-item img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      margin-right: 12px;
      border: 1px solid #666;
      border-radius: 4px;
      background: #333;
      flex-shrink: 0;
    }
    .plugin-item .name {
      font-size: 1rem;
      color: #eee;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      min-width: 0;
    }

    /* ======== БЕЙДЖИ ВЕРСИИ ======== */
    .source-badge {
      font-size: 0.7rem;
      padding: 3px 8px;
      border-radius: 10px;
      margin-left: 8px;
      white-space: nowrap;
      flex-shrink: 0;
      font-weight: bold;
      letter-spacing: 0.2px;
    }
    .source-badge.v1 {
      background: #1e4a78;
      color: #8fd0ff;
      border: 1px solid #2e6aa8;
    }
    .source-badge.v2 {
      background: #5a1e78;
      color: #e8b6ff;
      border: 1px solid #8a2eb8;
    }

    /* ======== DETAIL VIEW (скрыт до клика) ======== */
    #detail-view {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #222;
      color: #fff;
      display: none;
      flex-direction: column;
      z-index: 20;
      overflow-y: auto;
    }
    #detail-header {
      position: sticky;
      top: 0;
      background: rgba(30,30,30,0.95);
      display: flex;
      align-items: center;
      padding: 10px 15px;
      border-bottom: 1px solid #555;
      z-index: 21;
    }
    #detail-header .back-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      cursor: pointer;
    }

    #detail-content {
      padding: 15px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    /* Ряд с иконкой, названием и кнопкой */
    .icon-row {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }
    #detail-icon {
      width: 80px;
      height: 80px;
      object-fit: contain;
      margin-right: 15px;
      border: 1px solid #555;
      border-radius: 8px;
      background: #333;
      flex-shrink: 0;
    }
    .title-install {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .detail-name {
      font-size: 1.2rem;
      margin-bottom: 8px;
      color: #eee;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .detail-name .name-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .install-btn {
      font-size: 1.2rem;
      padding: 10px 20px;
      background: linear-gradient(to right, #0f0f0f, #444);
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
      align-self: flex-start;
    }
    .install-btn:disabled {
      background: #555;
      cursor: default;
    }
    .installed-label {
      font-size: 1.1rem;
      color: #3af;
      font-weight: bold;
    }
    .delete-btn {
      margin-top: 8px;
      font-size: 1rem;
      padding: 6px 12px;
      background: #660000;
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      width: fit-content;
    }
    .delete-btn:hover {
      background: #880000;
    }

    /* Горизонтальный ряд скриншотов (9:16) */
    .screenshots-row {
      display: flex;
      overflow-x: auto;
      margin: 10px 0;
      padding-bottom: 5px;
    }
    .screenshots-row img {
      width: 90px;
      height: 160px;
      object-fit: cover;
      border: 1px solid #555;
      border-radius: 4px;
      margin-right: 8px;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Блок описания */
    .desc-block {
      margin-top: 10px;
      font-size: 0.95rem;
      line-height: 1.4;
      color: #ddd;
    }

    /* ======== MODAL ДЛЯ УВЕЛИЧЕНИЯ СКРИНА ======== */
    #img-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 50;
    }
    #img-modal img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      border: 1px solid #fff;
      border-radius: 4px;
    }
    #img-modal .close-modal {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 2rem;
      color: #fff;
      background: none;
      border: none;
      cursor: pointer;
    }

    /* ======== КНОПКА «?» В НИЖНЕМ ПРАВОМ УГЛУ ======== */
    #help-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 20px;
      width: 40px;
      height: 40px;
      font-size: 1.2rem;
      cursor: pointer;
      z-index: 30;
    }
    #help-button:hover {
      background: #222;
    }
  </style>
</head>
<body>

  <!-- ======= HEADER (Главное меню) ======= -->
  <header id="main-header">
    <button class="back-btn-main" onclick="goToGlist()">←</button>
    <h1> GlistPlay  </h1>
    <div class="search-container">
      <input
        type="text"
        id="search-input"
        class="search-input"
        placeholder="Поиск плагинов"
      />
      <span class="search-icon">🔍</span>
    </div>
  </header>

  <!-- ======= СПИСОК ПЛАГИНОВ ======= -->
  <div id="plugin-list">
    Загрузка плагинов...
  </div>

  <!-- ======= DETAIL VIEW (скрыт до клика) ======= -->
  <div id="detail-view">
    <div id="detail-header">
      <button class="back-btn" onclick="closeDetail()">←</button>
    </div>
    <div id="detail-content">
      <div class="icon-row">
        <img src="" alt="icon" id="detail-icon" />
        <div class="title-install">
          <div class="detail-name" id="detail-name"></div>
          <div id="install-panel"></div>
        </div>
      </div>
      <div class="screenshots-row" id="screenshots-row"></div>
      <div class="desc-block" id="detail-description">
        Описание плагина
      </div>
    </div>
  </div>

  <!-- ======= MODAL ДЛЯ УВЕЛИЧЕНИЯ СКРИНА ======= -->
  <div id="img-modal">
    <button class="close-modal" onclick="closeModal()">✖</button>
    <img src="" alt="screenshot-large" id="modal-img" />
  </div>

  <!-- ======= КНОПКА «?» ======= -->
  <button id="help-button" onclick="openHelp()">?</button>

  <script>
    /* ======== НАСТРОЙКИ ======== */
    const PLUGIN_LIST_URL   = 'https://raw.githubusercontent.com/Vaneyn/glistnet/refs/heads/main/plugins.txt';
    const PLUGIN_LIST_URL_2 = 'https://raw.githubusercontent.com/Vaneyn/glistnet/refs/heads/main/plugins2.txt';

    /* ======== СОСТОЯНИЕ ======== */
    let pluginsData = [];
    let filteredPlugins = [];

    /* ======== ЗАГРУЗКА И ПАРСИНГ СПИСКОВ ======== */
    async function loadPlugins() {
      const container = document.getElementById('plugin-list');
      try {
        // Загружаем оба файла параллельно. plugins.txt обязателен,
        // plugins2.txt — опционален (если его нет — просто пропускаем).
        const [res1, res2] = await Promise.allSettled([
          fetch(PLUGIN_LIST_URL),
          fetch(PLUGIN_LIST_URL_2)
        ]);

        if (res1.status !== 'fulfilled' || !res1.value.ok) {
          throw new Error('Сервер вернул ' + (res1.value ? res1.value.status : 'ошибку') + ' для plugins.txt');
        }
        const txt1 = await res1.value.text();
        const plugins1 = parsePluginList(txt1).map(p => ({ ...p, source: '1.91+' }));

        // Второй список — если доступен
        let plugins2 = [];
        if (res2.status === 'fulfilled' && res2.value.ok) {
          try {
            const txt2 = await res2.value.text();
            plugins2 = parsePluginList(txt2).map(p => ({ ...p, source: '2+' }));
          } catch (e) {
            console.warn('Не удалось разобрать plugins2.txt', e);
          }
        } else {
          console.info('plugins2.txt недоступен — пропускаем.');
        }

        pluginsData = [...plugins1, ...plugins2];
        filteredPlugins = pluginsData.slice();
        renderPluginList(filteredPlugins);
      } catch (err) {
        container.textContent = 'Не удалось загрузить список плагинов.';
        console.error(err);
      }
    }

    function parsePluginList(text) {
      const items = [];
      const entries = text.trim().split('\n---\n');
      for (const entry of entries) {
        const lines = entry.trim().split('\n');
        const plugin = { name: '', description: '', code_url: '', icon_url: '', screenshots: [] };
        for (const line of lines) {
          const idx = line.indexOf(':');
          if (idx === -1) continue;
          const key = line.substring(0, idx).trim();
          const val = line.substring(idx + 1).trim();
          if (key === 'name') plugin.name = val;
          else if (key === 'description') plugin.description = val;
          else if (key === 'code_url') plugin.code_url = val;
          else if (key === 'icon_url') plugin.icon_url = val;
          else if (key === 'screenshots') {
            plugin.screenshots = val.split(',').map(s => s.trim()).filter(s => s);
          }
        }
        if (plugin.name && plugin.code_url) {
          items.push(plugin);
        }
      }
      return items;
    }

    /* ======== БЕЙДЖ ВЕРСИИ ======== */
    function makeBadge(source) {
      const span = document.createElement('span');
      span.className = 'source-badge ' + (source === '2+' ? 'v2' : 'v1');
      span.textContent = 'GList ' + source;
      return span;
    }

    /* ======== ОТОБРАЖЕНИЕ СПИСКА ПЛАГИНОВ ======== */
    function renderPluginList(list) {
      const container = document.getElementById('plugin-list');
      container.innerHTML = '';
      if (list.length === 0) {
        container.textContent = 'Ничего не найдено.';
        return;
      }
      list.forEach((plg) => {
        const item = document.createElement('div');
        item.className = 'plugin-item';

        const img = document.createElement('img');
        img.src = plg.icon_url;
        img.alt = 'icon';
        img.onerror = () => { img.style.display = 'none'; };

        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = plg.name;

        item.appendChild(img);
        item.appendChild(name);
        item.appendChild(makeBadge(plg.source));

        item.addEventListener('click', () => openDetailView(plg));
        container.appendChild(item);
      });
    }

    /* ======== ПОИСК (по названию и описанию) ======== */
    document.getElementById('search-input').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      filteredPlugins = pluginsData.filter(p =>
        p.name.toLowerCase().includes(q) ||
        p.description.toLowerCase().includes(q)
      );
      renderPluginList(filteredPlugins);
    });

    /* ======== ОТКРЫТИЕ DETAIL VIEW ======== */
    function openDetailView(plugin) {
      document.getElementById('plugin-list').style.display = 'none';
      document.getElementById('main-header').style.display = 'none';

      // Заголовок: название + бейдж версии
      const nameEl = document.getElementById('detail-name');
      nameEl.innerHTML = '';
      const nameText = document.createElement('span');
      nameText.className = 'name-text';
      nameText.textContent = plugin.name;
      nameEl.appendChild(nameText);
      nameEl.appendChild(makeBadge(plugin.source));

      // иконка
      const iconEl = document.getElementById('detail-icon');
      iconEl.style.display = '';
      iconEl.src = plugin.icon_url || '';
      iconEl.onerror = () => iconEl.style.display = 'none';

      // скриншоты
      const scrRow = document.getElementById('screenshots-row');
      scrRow.innerHTML = '';
      if (plugin.screenshots && plugin.screenshots.length) {
        plugin.screenshots.forEach(src => {
          const img = document.createElement('img');
          img.src = src;
          img.onerror = () => img.style.display = 'none';
          img.addEventListener('click', () => openModal(src));
          scrRow.appendChild(img);
        });
      }

      // описание
      document.getElementById('detail-description').textContent = plugin.description;

      // установка
      const panel = document.getElementById('install-panel');
      panel.innerHTML = '';
      const isInstalled = localStorage.getItem(plugin.name) !== null;
      if (isInstalled) {
        renderInstalledPanel(panel, plugin);
      } else {
        const btn = document.createElement('button');
        btn.className = 'install-btn';
        btn.textContent = '⬇️ Установить';
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          btn.textContent = 'Загрузка...';
          try {
            const res = await fetch(plugin.code_url);
            if (!res.ok) throw new Error('Ошибка загрузки кода');
            const code = await res.text();
            localStorage.setItem(plugin.name, code);
            panel.innerHTML = '';
            renderInstalledPanel(panel, plugin);
          } catch (err) {
            alert('Не удалось установить плагин.');
            btn.disabled = false;
            btn.textContent = '⬇️ Установить';
          }
        });
        panel.appendChild(btn);
      }

      document.getElementById('detail-view').style.display = 'flex';
    }

    function renderInstalledPanel(panel, plugin) {
      const lbl = document.createElement('div');
      lbl.className = 'installed-label';
      lbl.textContent = '✅ Установлено';
      panel.appendChild(lbl);

      const delBtn = document.createElement('button');
      delBtn.className = 'delete-btn';
      delBtn.textContent = 'Удалить';
      delBtn.addEventListener('click', () => {
        localStorage.removeItem(plugin.name);
        closeDetail();
      });
      panel.appendChild(delBtn);
    }

    /* ======== ЗАКРЫТИЕ DETAIL VIEW ======== */
    function closeDetail() {
      document.getElementById('detail-view').style.display = 'none';
      document.getElementById('plugin-list').style.display = 'flex';
      document.getElementById('main-header').style.display = 'flex';
    }

    /* ======== MODAL ДЛЯ УВЕЛИЧЕНИЯ СКРИНА ======== */
    function openModal(src) {
      const modal = document.getElementById('img-modal');
      const modalImg = document.getElementById('modal-img');
      modalImg.src = src;
      modal.style.display = 'flex';
    }
    function closeModal() {
      document.getElementById('img-modal').style.display = 'none';
    }

    /* ======== КНОПКА «← Назад» В ГЛАВНОМ МЕНЮ ======== */
    function goToGlist() {
      location.href = 'glist.html';
    }

    /* ======== КНОПКА «?» ======== */
    function openHelp() {
      location.href = 'mudak.html';
    }

    /* ======== НА ЗАГРУЗКЕ СТРАНИЦЫ ======== */
    window.addEventListener('load', loadPlugins);
  </script>
</body>
</html>
