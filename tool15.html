<!DOCTYPE html>
<html>
<head>
  <title>Игра</title>
  <style>
  	body {
			color: black;
			background-color: grey;
		}
		button {
		font-size: 45px;
			color: white;
			background-color: black;
		}
    #game-area {
      position: relative;
      width: 500px;
      height: 300px;
      border: 1px solid black;
    }
    #red-line {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 250px;
      width: 2px;
      background-color: red;
    }
    #green-bar {
      position: absolute;
      top: 0;
      left: 0;
      width: 5px;
      height: 20px;
      background-color: green;
      animation: move 1s linear infinite;
    }
    @keyframes move {
      0% { left: 0; }
      100% { left: 450px; }
    }
  </style>
</head>
<body>
  <div id="game-area">
    <div id="red-line"></div>
    <div id="green-bar"></div>
  </div>
  <p>Попытки: <span id="attempts">5</span></p>
  <p>Очки: <span id="score">0</span></p>
  <p>Рекорд: <span id="record"></span></p>
  <button id="stop-btn">Стоп</button>

  <script>
    let greenBar = document.getElementById("green-bar");
    let attemptsLeft = 5;
    let score = 0;
    let record = localStorage.getItem("record") || 0;

    function stopGame() {
      if (attemptsLeft > 0) {
        attemptsLeft--;
        document.getElementById("attempts").textContent = attemptsLeft;
        let distance = Math.abs(greenBar.offsetLeft - 252);
        let points = 100 - distance;

        if (points > 0) {
          if (distance < 5) {
            attemptsLeft += 3;
            document.getElementById("attempts").textContent = attemptsLeft;
          }
          score += points;
          document.getElementById("score").textContent = score;
        }

        greenBar.style.animationPlayState = "paused";
        setTimeout(function() {
          greenBar.style.animationPlayState = "running";
        }, 300);
      }
      if (attemptsLeft === 0) {
        let isNewRecord = score > record;
        if (isNewRecord) {
          record = score;
          localStorage.setItem("record", record);
          document.getElementById("record").textContent = record;
        }
        let message = isNewRecord
          ? `Поздравляем, вы установили новый рекорд: ${score}`
          : `Ваши очки: ${score}`;
        document.getElementById("attempts").textContent = 'Игра окончена';
        document.getElementById("score").textContent = message;
        document.getElementById("stop-btn").disabled = true;
      }
    }

    document.getElementById("stop-btn").addEventListener("click", stopGame);
    document.getElementById("record").textContent = record;

// Начало достижений

// Инициализация IndexedDB
function initDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open("AchievementsDB", 1);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => resolve(request.result);
        request.onupgradeneeded = (event) => {
            const db = event.target.result;
            db.createObjectStore("achievements", { keyPath: "title" });
        };
    });
}

// Добавление достижения и показ уведомления
async function addAchievement(title, text, image = false) {
    try {
        const db = await initDB();
        const transaction = db.transaction(["achievements"], "readwrite");
        const objectStore = transaction.objectStore("achievements");

        const checkRequest = objectStore.get(title);

        return new Promise((resolve) => {
            checkRequest.onsuccess = () => {
                if (!checkRequest.result) {
                    const newAchievement = { title, text, image: image || "button.png" };
                    objectStore.add(newAchievement).onsuccess = () => {
                        const div = document.createElement("div");
                        div.textContent = title;
                        div.style.position = "fixed";
                        div.style.top = "15px";
                        div.style.left = "5%";
                        div.style.width = "90%";
                        div.style.background = "#ffd700";
                        div.style.color = "#1a1a1a";
                        div.style.padding = "10px";
                        div.style.borderRadius = "8px";
                        div.style.boxShadow = "0 3px 10px rgba(0, 0, 0, 0.3)";
                        div.style.zIndex = "1000";
                        document.body.appendChild(div);
                        setTimeout(() => div.remove(), 3000);
                        resolve(true);
                    };
                } else {
                    resolve(false);
                }
            };
        });
    } catch (error) {
        console.error("Error:", error);
        return false;
    }
}

// Проверка и добавление достижения (1000 очков)
async function checkAndAddAchievement() {
    if (score >= 1001) {
        const added = await addAchievement(
            "Освоил палковую игру",
            "Вы почувствовали вайб лагов и багов, преисполнились ими и набрали 1к очков, не порвав очко.",
            "button.png"
        );
        if (added) console.log("Достижение добавлено!");
    }
}
setInterval(checkAndAddAchievement, 1000);
