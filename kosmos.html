
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Солнечная система 3D с кольцами Сатурна</title>
  <style>
    body, canvas { margin: 0; padding: 0; display: block; }
    canvas { touch-action: none; }
    #ui {
      position: absolute; top: 10px; left: 10px; z-index: 10;
      background: rgba(0,0,0,0.6); padding: 10px; border-radius: 4px;
      color: #fff; font-family: sans-serif; width: 300px;
    }
    #header { display: flex; justify-content: space-between; align-items: center; }
    #toggleBtn {
      background: none; border: none; color: #fff; font-size: 18px; cursor: pointer;
    }
    #controls { margin-top: 10px; }
    #controls.hidden { display: none; }
    #controls label, #controls button, #controls input, #controls select, #controls div {
      display: block; width: 100%; margin: 5px 0;
    }
    #controls input[type=range], #controls input[type=number], #controls select {
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div id="header">
      <strong>Панель</strong>
      <button id="toggleBtn">−</button>
    </div>
    <div id="controls">
      <label>Скорость (км/ч): <span id="speedVal">100</span></label>
      <input type="range" id="speed" min="100" max="1079252848.8" step="1000" value="100">
      <label>Скорость, % от c: <input type="number" id="pctSpeed" min="0.01" step="0.01" value="1"></label>
      <button id="applyPct">Установить %</button>
      <button id="gotoBtn">Направить на…</button>
      <select id="gotoSelect" style="display:none;"></select>
      <div id="nearest">Ближайший объект: <span id="nearestObj">—</span></div>
    </div>
    <label><input type="checkbox" id="engine"> Двигатель (вкл/выкл)</label>
  </div>

  <script src="newthreejs.txt"></script>
  <script>
    // Константы
    const AU     = 1.496e11;        // м
    const G      = 6.67430e-11;     // грав. const
    const humanH = 1.73;            // м
    const c_kmh  = 1079252848.8;    // км/ч

    // Сцена, камера, рендер
    const scene    = new THREE.Scene();
    const camera   = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.01, 1e13);
    const renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.domElement.style.touchAction = 'none';
    document.body.appendChild(renderer.domElement);

    // Освещение
    const sunLight = new THREE.PointLight(0xffffff, 3);
    sunLight.position.set(0,0,0);
    scene.add(sunLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
    dirLight.position.set(-1,0.5,0).normalize();
    scene.add(dirLight);
    const ambient = new THREE.AmbientLight(0xffffff, 0.2);
    scene.add(ambient);

    // Звёздное небо
    (()=>{
      const R = 1e13, N = 20000;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(N*3);
      for(let i=0;i<N;i++){
        const θ = Math.acos(2*Math.random()-1);
        const φ = 2*Math.PI*Math.random();
        pos[3*i  ] = R*Math.sin(θ)*Math.cos(φ);
        pos[3*i+1] = R*Math.sin(θ)*Math.sin(φ);
        pos[3*i+2] = R*Math.cos(θ);
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
      scene.add(new THREE.Points(geo,
        new THREE.PointsMaterial({ color:0xffffff, size:1, sizeAttenuation:false })
      ));
    })();

    // Атмосферный градиент неба
    const sky = { low:new THREE.Color(0x87CEEB), high:new THREE.Color(0x000000), fadeM:1e5 };
    function updateSky(){
      const E = bodies.find(b=>b.name==='Земля').mesh.position;
      const alt = camera.position.distanceTo(E) - bodies.find(b=>b.name==='Земля').radius;
      const t = THREE.MathUtils.clamp(alt/sky.fadeM,0,1);
      renderer.setClearColor(sky.low.clone().lerp(sky.high,t));
    }

    // Текстура Земли «🌸»
    function createFlowerTexture(){
      const S=512, cvs=document.createElement('canvas');
      cvs.width=cvs.height=S;
      const ctx=cvs.getContext('2d');
      ctx.fillStyle='#228B22'; ctx.fillRect(0,0,S,S);
      ctx.font='40px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      for(let x=0;x<S;x+=80) for(let y=0;y<S;y+=80)
        ctx.fillText('🌸', x+40, y+40);
      return new THREE.CanvasTexture(cvs);
    }

    // Массив тел (имена на русском)
    const bodies = [
      { name:'Солнце',   radius:695700e3,    mass:1.989e30,    distance:0,            mat:{} },
      { name:'Меркурий', radius:2439.7e3,    mass:3.3011e23,   distance:0.39*AU,      mat:{color:0x888888} },
      { name:'Венера',   radius:6051.8e3,    mass:4.8675e24,   distance:0.72*AU,      mat:{color:0xEED5B7} },
      { name:'Земля',    radius:6371.1366e3, mass:5.9724e24,   distance:1*AU,         mat:{map:createFlowerTexture()} },
      { name:'Марс',     radius:3389.5e3,    mass:6.4171e23,   distance:1.52*AU,      mat:{color:0xCC4422} },
      { name:'Юпитер',   radius:69911e3,     mass:1.898187e27, distance:5.2*AU,       mat:{color:0xffcc99} },
      { name:'Сатурн',   radius:58232e3,     mass:5.6834e26,   distance:9.58*AU,      mat:{color:0xffddbb} },
      { name:'Уран',     radius:25362e3,     mass:8.681e25,    distance:19.22*AU,     mat:{color:0xaaaaff} },
      { name:'Нептун',   radius:24622e3,     mass:1.02413e26,  distance:30.05*AU,     mat:{color:0x8888ff} },

      // Спутники (R ≥ 347 км)
      { name:'Луна',     radius:1737.1e3,    mass:7.3477e22,   distance:1*AU + 0.384e9,    mat:{color:0xAAAAAA} },
      { name:'Ио',       radius:1821.6e3,    mass:8.9319e22,   distance:5.2*AU + 0.4217e9,  mat:{color:0xff6633} },
      { name:'Европа',   radius:1561e3,      mass:4.8e22,      distance:5.2*AU + 0.6711e9,  mat:{color:0x9999ff} },
      { name:'Ганимед',  radius:2634.1e3,    mass:1.4819e23,   distance:5.2*AU + 1.0704e9,  mat:{color:0xcccccc} },
      { name:'Каллисто', radius:2410.3e3,    mass:1.07594e23,  distance:5.2*AU + 1.8827e9,  mat:{color:0x777777} },
      { name:'Титан',    radius:2574.73e3,   mass:1.3455e23,   distance:9.58*AU + 1.22183e9,mat:{color:0xffccaa} },
      { name:'Рея',      radius:763.5e3,     mass:2.3065e21,   distance:9.58*AU + 0.52704e9,mat:{color:0xdddddd} },
      { name:'Иапет',    radius:734.4e3,     mass:1.8056e21,   distance:9.58*AU + 3.56082e9,mat:{color:0xcccccc} },
      { name:'Диона',    radius:561.5e3,     mass:1.0955e21,   distance:9.58*AU + 0.3774e9, mat:{color:0xddddbb} },
      { name:'Тефия',    radius:533e3,       mass:2.1742e20,   distance:9.58*AU + 0.29466e9,mat:{color:0xddddff} },
      { name:'Титания',  radius:788.9e3,     mass:3.527e21,    distance:19.22*AU + 0.4363e9, mat:{color:0xaaaaff} },
      { name:'Оберон',    radius:761.4e3,     mass:3.014e21,    distance:19.22*AU + 0.5835e9, mat:{color:0xaaaaaa} },
      { name:'Умбриэль',  radius:584.7e3,     mass:1.27e21,     distance:19.22*AU + 0.266e9,  mat:{color:0x888888} },
      { name:'Ариэль',    radius:578.9e3,     mass:1.29e21,     distance:19.22*AU + 0.19102e9,mat:{color:0x999999} },
      { name:'Тритон',    radius:1353.4e3,    mass:2.14e22,     distance:30.05*AU + 0.354759e9,mat:{color:0xccccff} },
      { name:'Харон',    radius:606e3,       mass:6.06e21,     distance:39.48*AU + 0.01964e9, mat:{color:0x999999} },

      // Карликовые планеты
      { name:'Церера',   radius:476e3,       mass:9.5e20,      distance:2.77*AU,         mat:{color:0x888888} },
      { name:'Плутон',   radius:1188.3e3,    mass:1.303e22,    distance:39.48*AU,        mat:{color:0xcccccc} },
      { name:'Хаумеа',   radius:1436e3,      mass:4.006e21,    distance:43.13*AU,        mat:{color:0xccccff} },
      { name:'Макемаке', radius:750e3,       mass:3e21,        distance:45.79*AU,        mat:{color:0xccccbb} },
      { name:'Эрида',    radius:1163e3,      mass:1.6466e22,   distance:67.78*AU,        mat:{color:0xccccdd} }
    ];

    // Создание мешей и кольца Сатурна
    bodies.forEach(b=>{
      let mat;
      if(b.name==='Солнце'){
        mat = new THREE.MeshStandardMaterial({
          color:0x000000, emissive:0xffffaa, emissiveIntensity:10,
          roughness:0.5, metalness:0
        });
      } else {
        mat = new THREE.MeshStandardMaterial(Object.assign({}, b.mat, {
          transparent:false, opacity:1
        }));
      }
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(b.radius,64,64),
        mat
      );
      mesh.position.x = b.distance;
      scene.add(mesh);
      b.mesh = mesh;

      // если это Сатурн — добавляем кольцо
      if(b.name==='Сатурн'){
        const inner = b.radius * 1.2;
        const outer = b.radius * 2.5;
        const ringGeo = new THREE.RingGeometry(inner, outer, 128, 1);
        const ringMat = new THREE.MeshBasicMaterial({
          color: 0xDDDD88,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.6
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI/2;
        ring.position.copy(mesh.position);
        scene.add(ring);
      }
    });

    // Корона и гало Солнца
    const sunR = bodies.find(b=>b.name==='Солнце').radius;
    scene.add(new THREE.Mesh(
      new THREE.SphereGeometry(sunR*8,32,32),
      new THREE.MeshBasicMaterial({
        color:0xffffee, transparent:true, opacity:0.15,
        blending:THREE.AdditiveBlending, depthWrite:false
      })
    ));
    const glow = new THREE.Sprite(new THREE.SpriteMaterial({
      map:(()=>{
        const S=512,c=document.createElement('canvas');
        c.width=c.height=S;
        const ctx=c.getContext('2d');
        const g=ctx.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);
        g.addColorStop(0,'rgba(255,255,200,0.7)');
        g.addColorStop(0.5,'rgba(255,200,100,0.3)');
        g.addColorStop(1,'rgba(255,200,100,0)');
        ctx.fillStyle=g; ctx.fillRect(0,0,S,S);
        return new THREE.CanvasTexture(c);
      })(),
      blending:THREE.AdditiveBlending, transparent:true, depthWrite:false
    }));
    glow.scale.set(sunR*10,sunR*10,1);
    scene.add(glow);

    // Камера: на поверхности Земли + рост человека
    const earthBody = bodies.find(b=>b.name==='Земля');
    camera.position.copy(earthBody.mesh.position);
    camera.position.y += earthBody.radius + humanH + 10;
    let yaw=Math.PI, pitch=-Math.PI/8;
    camera.rotation.order='YXZ';
    camera.rotation.y=yaw; camera.rotation.x=pitch;

    // Свайпы
    let down=false, px=0, py=0;
    renderer.domElement.addEventListener('pointerdown', e=>{
      e.preventDefault(); down=true; px=e.clientX; py=e.clientY;
      renderer.domElement.setPointerCapture(e.pointerId);
    });
    renderer.domElement.addEventListener('pointerup', e=>{
      e.preventDefault(); down=false; renderer.domElement.releasePointerCapture(e.pointerId);
    });
    renderer.domElement.addEventListener('pointermove', e=>{
      if(!down) return; e.preventDefault();
      const dx=e.clientX-px, dy=e.clientY-py;
      px=e.clientX; py=e.clientY;
      yaw   -= dx * 0.02;
      pitch -= dy * 0.02;
      pitch = THREE.MathUtils.clamp(pitch,-Math.PI/2+0.1,Math.PI/2-0.1);
      camera.rotation.y=yaw; camera.rotation.x=pitch;
    });

    // Физика
    let velG=new THREE.Vector3();
    const speedSlider=document.getElementById('speed'),
          speedVal   =document.getElementById('speedVal'),
          engineBox  =document.getElementById('engine'),
          pctInput   =document.getElementById('pctSpeed'),
          applyPct   =document.getElementById('applyPct');
    speedSlider.oninput = ()=> speedVal.textContent = Math.round(+speedSlider.value);
    applyPct.onclick = ()=>{
      const p=parseFloat(pctInput.value);
      if(!isNaN(p)&&p>0){
        const v = p/100 * c_kmh;
        speedSlider.max = Math.max(+speedSlider.max, v*1.1);
        speedSlider.value = v;
        speedVal.textContent = Math.round(v);
      }
    };
    function applyPhysics(dt){
      velG.set(0,0,0);
      bodies.forEach(b=>{
        const dir=new THREE.Vector3().subVectors(camera.position,b.mesh.position);
        const d=dir.length();
        if(d>b.radius){
          const a=G*b.mass/(d*d);
          velG.add(dir.normalize().multiplyScalar(-a*dt));
        }
      });
      const velE=new THREE.Vector3();
      if(engineBox.checked){
        const mps = +speedSlider.value*1000/3600;
        velE.copy(new THREE.Vector3(0,0,-1).applyEuler(camera.rotation))
             .multiplyScalar(mps);
      }
      camera.position.add( velG.clone().add(velE).multiplyScalar(dt) );
      // коллизии
      bodies.forEach(b=>{
        const v=new THREE.Vector3().subVectors(camera.position,b.mesh.position);
        const dist=v.length(), minD=b.radius+0.1;
        if(dist<minD){
          camera.position.copy(
            b.mesh.position.clone().add(v.normalize().multiplyScalar(minD))
          );
        }
      });
    }

    // Навигация «Направить»
    const gotoBtn=document.getElementById('gotoBtn'),
          gotoSelect=document.getElementById('gotoSelect');
    bodies.forEach(b=>{
      const o=document.createElement('option');
      o.value=b.name; o.text=b.name;
      gotoSelect.add(o);
    });
    gotoBtn.onclick = ()=> {
      gotoSelect.style.display = gotoSelect.style.display==='none'?'block':'none';
    };
    gotoSelect.onchange = ()=>{
      const pos = bodies.find(b=>b.name===gotoSelect.value).mesh.position;
      camera.lookAt(pos);
      yaw   = camera.rotation.y;
      pitch = camera.rotation.x;
      gotoSelect.style.display='none';
    };

    // Свернуть/развернуть UI
    const toggleBtn = document.getElementById('toggleBtn'),
          controls  = document.getElementById('controls');
    toggleBtn.onclick = ()=>{
      const hidden = controls.classList.toggle('hidden');
      toggleBtn.textContent = hidden? '+' : '−';
    };

    // Анимация
    let last = performance.now();
    (function loop(){
      const now=(performance.now()), dt=(now-last)/1000; last=now;
      applyPhysics(dt);
      updateSky();
      // ближайший объект
      const nearest = bodies.reduce((p,b)=>
        camera.position.distanceTo(b.mesh.position) <
        camera.position.distanceTo(p.mesh.position) ? b : p
      , bodies[0]);
      document.getElementById('nearestObj').textContent = nearest.name;
      renderer.render(scene,camera);
      requestAnimationFrame(loop);
    })();

    // Ресайз
    window.addEventListener('resize', ()=>{
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
    });
  </script>
</body>
</html>
