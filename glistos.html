<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>G-list OS v1.91</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0a0a0a;
      background-image:
        radial-gradient(circle at center, #002200 0%, #000 80%),
        linear-gradient(to right, rgba(0, 80, 0, 0.1) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 80, 0, 0.1) 1px, transparent 1px);
      background-size: 100% 100%, 20px 20px, 20px 20px;
      color: #0f0;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      padding: 10px;
      overflow-x: hidden;
    }

    .container {
      max-width: 98%;
      margin: 0 auto;
      border: 2px solid #0f0;
      background-color: rgba(0, 20, 0, 0.85);
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
      position: relative;
      padding: 15px;
    }

    h1 {
      color: #0f0;
      text-align: center;
      text-shadow: 0 0 8px #0f0;
      border-bottom: 2px solid #0f0;
      padding-bottom: 10px;
      margin: 5px 0 15px;
      font-size: 1.8em;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    button {
      background-color: #001100;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 8px 14px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 0 5px rgba(0, 255, 0, 0.3);
      flex-grow: 1;
      min-width: 120px;
    }

    button:hover {
      background-color: #003300;
      box-shadow: 0 0 10px rgba(0, 255, 0, 0.6);
    }

    button:active {
      background-color: #002200;
      transform: translateY(1px);
    }

    textarea {
      background-color: #001100;
      color: #0f0;
      border: 1px solid #0f0;
      padding: 12px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
      resize: vertical;
      margin-bottom: 12px;
      box-shadow: inset 0 0 8px rgba(0, 255, 0, 0.3);
    }

    #js-code {
      background-color: #3d2800;
      color: #ffd700;
      border-color: #b5651d;
    }

    .panel {
      margin: 15px 0;
      padding: 15px;
      border: 1px solid #0f0;
      background-color: rgba(0, 20, 0, 0.6);
    }

    .panel-title {
      margin-top: 0;
      color: #0f0;
      border-bottom: 1px solid #0f0;
      padding-bottom: 8px;
      font-size: 1.3em;
      text-shadow: 0 0 4px #0f0;
    }

    #console {
      min-height: 80px;
      max-height: 200px;
      overflow-y: auto;
      padding: 12px;
      background-color: #001100;
      border: 1px solid #0f0;
      margin-top: 15px;
      font-family: 'Courier New', monospace;
      white-space: pre-wrap;
      font-size: 14px;
    }

    #error-output {
      color: #f00;
      white-space: pre-wrap;
      padding: 12px;
      background-color: rgba(30, 0, 0, 0.7);
      border: 1px solid #f00;
      margin-top: 15px;
      font-family: 'Courier New', monospace;
      max-height: 180px;
      overflow-y: auto;
      font-size: 14px;
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #002200;
      min-width: 220px;
      max-width: 80vw;
      box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.7);
      z-index: 100;
      border: 1px solid #0f0;
      left: 0;
      top: 100%;
      margin-top: 5px;
    }

    .dropdown-content div {
      color: #0f0;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      cursor: pointer;
      border-bottom: 1px solid #0f0;
      background-color: #001100;
      font-size: 14px;
      transition: background-color 0.2s;
    }

    .dropdown-content div:hover {
      background-color: #003300;
      text-shadow: 0 0 5px #0f0;
    }

    .dropdown-content div:last-child {
      border-bottom: none;
    }

    .show {
      display: block;
    }

    .js-panel {
      margin-top: 20px;
    }

    .js-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      position: relative;
    }

    .retro-glow {
      text-shadow: 0 0 6px #0f0;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      padding-top: 8px;
      border-top: 1px solid #0f0;
      font-size: 13px;
      color: #0a0;
    }

    /* ===== СЛОЙ ЗАПУСКА: код выполняется на всё окно (шелла), ниже интерфейса шелла ===== */
    #run-layer {
      display: none;
      position: fixed;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;
      background: #fff;
    }

    #run-layer.open {
      display: block;
    }

    #run-frame {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    #run-exit {
      display: none;
      position: absolute;
      right: 6px;
      top: 6px;
      z-index: 2;
      min-width: 0;
      flex-grow: 0;
      padding: 3px 8px;
      font-size: 12px;
      background: #000;
    }

    #run-toast {
      position: absolute;
      left: 50%;
      bottom: 34px;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      color: #0f0;
      border: 1px solid #0f0;
      font: 11px 'Courier New', monospace;
      padding: 4px 8px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
      white-space: nowrap;
      z-index: 2;
    }

    @media (max-width: 768px) {
      .container {
        padding: 10px;
      }

      button {
        min-width: 100px;
        padding: 7px 10px;
        font-size: 13px;
      }

      textarea {
        padding: 10px;
        font-size: 13px;
      }

      .panel {
        padding: 12px;
      }
    }

    /* маленькое окно шелла */
    @media (max-width: 480px) {
      body {
        padding: 4px;
      }

      .container {
        padding: 8px;
      }

      h1 {
        font-size: 1.15em;
        margin: 2px 0 8px;
        padding-bottom: 6px;
      }

      .toolbar {
        gap: 5px;
        margin-bottom: 8px;
      }

      button {
        min-width: 70px;
        padding: 6px 6px;
        font-size: 12px;
      }

      .panel {
        margin: 8px 0;
        padding: 8px;
      }

      .panel-title {
        font-size: 1.05em;
      }

      textarea {
        font-size: 12px;
        padding: 8px;
      }

      #console,
      #error-output {
        font-size: 12px;
        padding: 8px;
      }

      .status-bar {
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="retro-glow">G-list OS <span class="version" id="ver">v1.91</span></h1>

    <div class="toolbar">
      <button onclick="goBack()">НАЗАД</button>
      <button onclick="clearAll()">ОЧИСТИТЬ ВСЁ</button>
      <button onclick="runCode()">ВЫПОЛНИТЬ КОД</button>
    </div>

    <div class="panel">
      <h2 class="panel-title">HTML редактор</h2>
      <textarea id="input-data" rows="8" placeholder="Введите HTML код здесь..."></textarea>
    </div>

    <div class="panel js-panel">
      <h2 class="panel-title">JavaScript консоль <span class="retro-glow"></span></h2>

      <div class="js-controls">
        <div class="dropdown">
          <button onclick="toggleDropdown()">Базовые</button>
          <div id="basicDropdown" class="dropdown-content">
            <div onclick="insertBasicCode('showConsole')">Показ консоли</div>
            <div onclick="insertBasicCode('clearConsole')">Очистка консоли</div>
            <div onclick="insertBasicCode('loadJS')">Исполнение JS по ссылке</div>
          </div>
        </div>
        <button onclick="runJavaScript()">Выполнить JS</button>
      </div>

      <textarea id="js-code" rows="4" placeholder="Введите JavaScript код здесь..."></textarea>
    </div>

    <div id="console"></div>
    <div id="error-output"></div>

    <div class="status-bar">
      <span id="status">Система готова к работе</span>
      <span>Версия: 1.91</span>
    </div>
  </div>

  <!-- слой запуска: на всё окно -->
  <div id="run-layer">
    <button id="run-exit" onclick="closeRun()">[X] РЕДАКТОР</button>
    <div id="run-toast"></div>
  </div>

  <script>
    // ===== Связь с Шеллом (autorun.js), если мы внутри него =====
    var shell = null;
    var runOpen = false;
    var verTaps = 0;
    var verLast = 0;

    try {
      if (window.parent && window.parent !== window && window.parent.__glistShell) {
        shell = window.parent.__glistShell;
      }
    } catch (e) {
      shell = null;
    }

    function el(id) {
      return document.getElementById(id);
    }

    // Инициализация системы
    function initSystem() {
      logToConsole('Система G-list OS v1.91 инициализирована');
      logToConsole('Готов');
      if (shell) logToConsole('Режим Шелла: код запускается на всё окно, интерфейс Шелла остаётся');
      el('status').textContent = 'Система готова';
    }

    // Логирование в консоль (через текстовый узел, чтобы вывод не превращался в HTML)
    function logToConsole(message) {
      var consoleDiv = el('console');
      consoleDiv.appendChild(document.createTextNode('> ' + message + '\n'));
      consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }

    // Назад: в меню Шелла
    function goBack() {
      if (shell && shell.menu) {
        shell.menu();
      } else if (window.history.length > 1) {
        window.history.back();
      } else {
        logToConsole('Назад некуда: это единственная страница');
      }
    }

    // Показать/скрыть выпадающее меню
    function toggleDropdown() {
      el('basicDropdown').classList.toggle('show');
    }

    function insideDropdown(node) {
      while (node) {
        if (node.className && String(node.className).indexOf('dropdown') !== -1) return true;
        node = node.parentNode;
      }
      return false;
    }

    // Закрыть выпадающее меню при клике вне его
    window.addEventListener('click', function (event) {
      if (!insideDropdown(event.target)) {
        el('basicDropdown').classList.remove('show');
      }
    });

    // Вставить базовый код в JS поле
    function insertBasicCode(type) {
      var jsTextarea = el('js-code');
      var code = '';

      switch (type) {
        case 'showConsole':
          code = [
            '// Показать консоль',
            'function showConsole() {',
            "  const consoleDiv = document.getElementById('console');",
            "  consoleDiv.style.display = 'block';",
            "  logToConsole('Консоль активирована');",
            '}',
            'showConsole();'
          ].join('\n');
          break;

        case 'clearConsole':
          code = [
            '// Очистить консоль',
            'function clearConsole() {',
            "  document.getElementById('console').innerHTML = '';",
            "  logToConsole('Консоль очищена');",
            '}',
            'clearConsole();'
          ].join('\n');
          break;

        case 'loadJS':
          code = [
            '// Загрузить и выполнить JS по URL',
            'function loadJSFromUrl(url) {',
            '  fetch(url)',
            '    .then(response => response.text())',
            '    .then(code => {',
            '      try {',
            '        eval(code);',
            "        logToConsole('Код успешно выполнен: ' + url);",
            '      } catch (error) {',
            "        logToConsole('Ошибка выполнения: ' + error.message);",
            '      }',
            '    })',
            '    .catch(error => {',
            "      logToConsole('Ошибка загрузки: ' + error.message);",
            '    });',
            '}',
            '',
            '// Пример использования:',
            "// loadJSFromUrl('https://example.com/script.js');"
          ].join('\n');
          break;
      }

      jsTextarea.value = code;
      toggleDropdown();
    }

    // Выполнить JavaScript код
    function runJavaScript() {
      var jsCode = el('js-code').value;
      el('error-output').textContent = '';
      el('status').textContent = 'Выполнение JavaScript...';

      var originalConsoleLog = console.log;
      try {
        // Перехватываем console.log для вывода в нашу консоль
        console.log = function () {
          var parts = [];
          for (var i = 0; i < arguments.length; i++) {
            var a = arguments[i];
            var s;
            try {
              s = (typeof a === 'object') ? JSON.stringify(a) : String(a);
            } catch (err) {
              s = String(a);
            }
            parts.push(s);
          }
          logToConsole(parts.join(' '));
          try { originalConsoleLog.apply(console, arguments); } catch (err2) {}
        };

        eval(jsCode);
        logToConsole('JavaScript код успешно выполнен');
      } catch (error) {
        var errorMessage = 'Ошибка JavaScript: ' + error.message;
        el('error-output').textContent = errorMessage;
        logToConsole(errorMessage);
      } finally {
        console.log = originalConsoleLog;
      }

      el('status').textContent = 'JavaScript выполнен';
    }

    // Очистить всё
    function clearAll() {
      el('console').textContent = '';
      el('error-output').textContent = '';
      el('input-data').value = '';
      el('js-code').value = '';
      logToConsole('Все данные очищены');
      el('status').textContent = 'Данные очищены';
    }

    // ===== Запуск HTML-кода на всё окно =====
    function showToast(text) {
      var t = el('run-toast');
      t.textContent = text;
      t.style.opacity = '1';
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(function () { t.style.opacity = '0'; }, 2800);
    }

    function closeRun() {
      var layer = el('run-layer');
      var f = el('run-frame');
      if (f && f.parentNode) f.parentNode.removeChild(f); // гасим таймеры и звук запущенного кода
      layer.className = '';
      runOpen = false;
      el('status').textContent = 'Вернулись в редактор';
    }

    function runCode() {
      var input = el('input-data').value;
      el('error-output').textContent = '';

      if (!input.replace(/\s/g, '')) {
        logToConsole('HTML пустой — запускать нечего');
        return;
      }

      // каждый запуск — новый чистый документ
      var old = el('run-frame');
      if (old && old.parentNode) old.parentNode.removeChild(old);

      var layer = el('run-layer');
      var frame = document.createElement('iframe');
      frame.id = 'run-frame';
      layer.insertBefore(frame, layer.firstChild);
      layer.className = 'open';
      runOpen = true;

      try {
        var doc = frame.contentWindow.document;
        doc.open();
        doc.write(input);
        doc.close();
      } catch (e) {
        var msg = 'Ошибка запуска: ' + e.message;
        el('error-output').textContent = msg;
        logToConsole(msg);
        closeRun();
        return;
      }

      if (!shell) el('run-exit').style.display = 'block';
      logToConsole('Код запущен на всё окно');
      el('status').textContent = 'Код выполняется';
      showToast(shell ? '[<] в шапке — назад в редактор' : 'Esc или [X] — назад в редактор');
    }

    // Esc — назад в редактор (для ПК)
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && runOpen) closeRun();
    });

    // Кнопка "<" в шапке Шелла: сначала закрывает запуск, потом уже ведёт в меню
    if (shell && shell.setBackHook) {
      try {
        shell.setBackHook(function () {
          if (runOpen) {
            closeRun();
            return true;
          }
          return false;
        });
      } catch (e) {}
    }

    // Пасхалка: 7 быстрых тапов по версии
    el('ver').onclick = function () {
      var n = Date.now();
      verTaps = (n - verLast < 1200) ? verTaps + 1 : 1;
      verLast = n;
      if (verTaps >= 7) {
        verTaps = 0;
        logToConsole('G-list OS: меня загрузили, но куда — не сказали.');
      }
    };

    // Глобальная обработка ошибок
    window.onerror = function (message, source, lineno, colno, error) {
      var errorMessage = 'Ошибка: ' + message + ' в ' + source + ':' + lineno + ':' + colno;
      if (error && error.stack) {
        errorMessage += '\n' + error.stack;
      }

      el('error-output').textContent += errorMessage + '\n';
      logToConsole(errorMessage);
      return true;
    };

    // Инициализация при загрузке
    window.onload = initSystem;
  </script>
</body>
</html>
