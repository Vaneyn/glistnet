<!DOCTYPE html>
<html>
<head>
  <title>Портал в другое измерение</title>
  <style>
    body {
      overflow: hidden;
      margin: 0;
    }

    #portal {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
	</script>
  <button onclick="runTool('terminal')">НАЗАД</button>

<body>
  <div id="portal"></div>

  <script>
    setInterval(function() {
      document.body.style.backgroundColor = getRandomColor();
    }, 1000);

    function getRandomColor() {
      var letters = '0123456789ABCDEF';
      var color = '#';
      for (var i = 0; i < 6; i++) {
        color += letters[Math.floor(Math.random() * 16)];
      }
      return color;
    }
  </script>
  </script>
	<script>
		function runTool(toolName) {
			var url = toolName + ".html";
			window.open(url, "_blank");
		}
	</script>
</body>
</html>
