<!DOCTYPE html>
<html>
<head>
    <title>Серый калькулятор</title>
    <style>
        body {
            background-color: #f2f2f2;
        }

        .container {
            margin: 0 auto;
            width: 300px;
            padding: 20px;
            background-color: #ccc;
            border-radius: 10px;
        }

        .input {
            margin-bottom: 10px;
            padding: 10px;
            width: 100%;
            font-size: 18px;
            box-sizing: border-box;
        }

        .button {
            display: inline-block;
            margin: 5px;
            padding: 10px 20px;
            font-size: 18px;
            background-color: #666;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .button:hover {
            background-color: #444;
        }
    </style>
</head>
<body>
    <div class="container">
        <input type="text" id="result" class="input" readonly>
        <table>
            <tr>
                <td><input type="button" value="7" class="button" onclick="appendToResult('7')"></td>
                <td><input type="button" value="8" class="button" onclick="appendToResult('8')"></td>
                <td><input type="button" value="9" class="button" onclick="appendToResult('9')"></td>
                <td><input type="button" value="+" class="button" onclick="appendToResult('+')"></td>
            </tr>
            <tr>
                <td><input type="button" value="4" class="button" onclick="appendToResult('4')"></td>
                <td><input type="button" value="5" class="button" onclick="appendToResult('5')"></td>
                <td><input type="button" value="6" class="button" onclick="appendToResult('6')"></td>
                <td><input type="button" value="-" class="button" onclick="appendToResult('-')"></td>
            </tr>
            <tr>
                <td><input type="button" value="1" class="button" onclick="appendToResult('1')"></td>
                <td><input type="button" value="2" class="button" onclick="appendToResult('2')"></td>
                <td><input type="button" value="3" class="button" onclick="appendToResult('3')"></td>
                <td><input type="button" value="*" class="button" onclick="appendToResult('*')"></td>
            </tr>
            <tr>
                <td><input type="button" value="0" class="button" onclick="appendToResult('0')"></td>
                <td><input type="button" value="." class="button" onclick="appendToResult('.')"></td>
                <td><input type="button" value="=" class="button" onclick="calculateResult()"></td>
                <td><input type="button" value="/" class="button" onclick="appendToResult('/')"></td>
            </tr>
            <tr>
                <td colspan="4"><input type="button" value="C" class="button" onclick="clearResult()"></td>
            </tr>
        </table>
    </div>

    <script>
        // ================= СИСТЕМА ДОСТИЖЕНИЙ =================
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("AchievementsDB", 1);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains("achievements")) {
                        db.createObjectStore("achievements", { keyPath: "title" });
                    }
                };
            });
        }

        async function addAchievement(title, text, image = false) {
            try {
                const db = await initDB();
                const transaction = db.transaction(["achievements"], "readwrite");
                const objectStore = transaction.objectStore("achievements");
                const checkRequest = objectStore.get(title);

                return new Promise((resolve) => {
                    checkRequest.onsuccess = () => {
                        if (!checkRequest.result) {
                            const newAchievement = { title, text, image: image || "button.png" };
                            objectStore.add(newAchievement).onsuccess = () => {
                                const div = document.createElement("div");
                                div.textContent = title;
                                div.style.position = "fixed";
                                div.style.top = "15px";
                                div.style.left = "5%";
                                div.style.width = "90%";
                                div.style.background = "#ffd700";
                                div.style.color = "#1a1a1a";
                                div.style.padding = "10px";
                                div.style.borderRadius = "8px";
                                div.style.boxShadow = "0 3px 10px rgba(0, 0, 0, 0.3)";
                                div.style.zIndex = "1000";
                                document.body.appendChild(div);
                                setTimeout(() => div.remove(), 3000);
                                resolve(true);
                            };
                        } else {
                            resolve(false);
                        }
                    };
                });
            } catch (error) {
                // Тихо игнорируем ошибки самой системы достижений
                return false;
            }
        }

        // Достижение "Проказник"
        async function unlockPrankster() {
            await addAchievement(
                "Проказник",
                "Шалун, и вообще больше так не делай",
                "button.png"
            );
        }

        // ============ ГЛОБАЛЬНЫЙ ПЕРЕХВАТ ОШИБОК ============
        window.onerror = function () {
            unlockPrankster();
            return true; // подавляем вывод ошибки в консоль
        };

        window.addEventListener("unhandledrejection", function (event) {
            event.preventDefault();
            unlockPrankster();
        });

        // Также подавляем вывод в консоль от самого addAchievement
        window.addEventListener("error", function (e) {
            e.preventDefault();
            unlockPrankster();
            return true;
        }, true);

        // ================= ЛОГИКА КАЛЬКУЛЯТОРА =================
        function appendToResult(value) {
            try {
                document.getElementById('result').value += value;
            } catch (e) {
                unlockPrankster();
            }
        }

        function calculateResult() {
            try {
                const expr = document.getElementById('result').value;
                // Проверяем на всякий случай пустую строку
                if (!expr.trim()) {
                    unlockPrankster();
                    return;
                }
                const result = eval(expr);
                // Если получилось не число (например, деление на 0 даст Infinity)
                if (typeof result === 'number' && !isFinite(result)) {
                    unlockPrankster();
                    document.getElementById('result').value = '';
                    return;
                }
                document.getElementById('result').value = result;
            } catch (e) {
                // Пользователь ввёл что-то не то — выдаём достижение
                unlockPrankster();
                document.getElementById('result').value = '';
            }
        }

        function clearResult() {
            try {
                document.getElementById('result').value = '';
            } catch (e) {
                unlockPrankster();
            }
        }
    </script>

    <script>
        function runTool(toolName) {
            try {
                var url = toolName + ".html";
                window.open(url, "_blank");
            } catch (e) {
                unlockPrankster();
            }
        }
    </script>

    <button onclick="runTool('glist')">НАЗАД</button>
</body>
</html>
