<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Генерация звука</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 0;
      padding: 20px;
    }
    .container { max-width: 820px; margin: 0 auto; }
    h1 { font-weight: 300; letter-spacing: 1px; text-align: center; margin-bottom: 20px; }
    .panel {
      background: #2a2a2a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .panel h2 {
      margin: 0 0 15px;
      font-size: 13px;
      font-weight: 600;
      color: #9a9a9a;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 10px 0; }
    .row > label { min-width: 110px; color: #a0a0a0; font-size: 14px; }
    input[type="number"], select {
      background: #1e1e1e;
      color: #e0e0e0;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="number"]:focus, select:focus { border-color: #00bcd4; }
    input[type="number"] { width: 110px; }
    input[type="range"] {
      flex: 1; padding: 0; height: 32px;
      accent-color: #00bcd4;
      background: transparent;
    }
    button {
      background: #3a3a3a;
      color: #e0e0e0;
      border: none;
      padding: 9px 15px;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
      font-family: inherit;
    }
    button:hover { background: #4a4a4a; }
    button:active { transform: scale(0.97); }
    button.primary { background: #00bcd4; color: #002; font-weight: 600; }
    button.primary:hover { background: #00d0e8; }
    button.danger { background: #c0392b; color: #fff; font-weight: 600; }
    button.danger:hover { background: #e74c3c; }
    button.preset { background: #2a2a2a; border: 1px solid #444; padding: 6px 12px; font-size: 13px; }
    button.preset:hover { background: #3a3a3a; border-color: #00bcd4; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    canvas {
      width: 100%; height: 180px; display: block;
      background: #0a0a0a; border-radius: 8px;
    }
    .freq-display {
      font-size: 42px; font-weight: 200; color: #00bcd4;
      text-align: center; margin-top: 15px;
      font-variant-numeric: tabular-nums;
    }
    .note-display {
      font-size: 18px; color: #888; text-align: center; margin-bottom: 10px;
    }
    #playingIndicator {
      display: inline-block; width: 12px; height: 12px;
      border-radius: 50%; background: #444; margin-right: 8px;
      transition: background 0.2s;
    }
    #playingIndicator.on {
      background: #4caf50;
      box-shadow: 0 0 12px #4caf50;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse { 50% { opacity: 0.4; } }
    .hint { font-size: 12px; color: #666; margin-top: 10px; text-align: center; }
    .hint b { color: #999; }
    .peak-info { text-align: center; font-size: 20px; color: #00bcd4; margin: 12px 0; font-variant-numeric: tabular-nums; }
    hr { border: none; border-top: 1px solid #3a3a3a; margin: 18px 0; }
  </style>
</head>
<body>
<div class="container">
  <h1>Генерация звука</h1>

  <div class="panel">
    <h2>Генератор</h2>
    <canvas id="oscilloscope"></canvas>
    <div class="freq-display" id="freqDisplay">440 Hz</div>
    <div class="note-display" id="noteDisplay">A4</div>

    <div class="row">
      <label for="frequency">Частота (Гц):</label>
      <input type="number" id="frequency" value="440" min="1" max="20000" step="1">
      <button onclick="changeFrequency(-10)">− 10</button>
      <button onclick="changeFrequency(10)">+ 10</button>
    </div>
    <div class="row">
      <input type="range" id="frequencySlider" value="440" min="1" max="20000" step="1">
    </div>
    <div class="row">
      <button class="preset" onclick="setFrequency(440)">A4 · 440</button>
      <button class="preset" onclick="setFrequency(1000)">1 кГц</button>
      <button class="preset" onclick="setFrequency(8000)">8 кГц</button>
      <button class="preset" onclick="setFrequency(15000)">15 кГц</button>
      <button class="preset" onclick="setFrequency(20000)">20 кГц</button>
    </div>

    <div class="row">
      <label for="waveform">Форма волны:</label>
      <select id="waveform">
        <option value="sine">Синус (sine)</option>
        <option value="square">Квадрат (square)</option>
        <option value="triangle">Треугольник (triangle)</option>
        <option value="sawtooth">Пила (sawtooth)</option>
      </select>
    </div>

    <hr>

    <h2>Свип (плавное изменение частоты)</h2>
    <div class="row">
      <label>От (Гц):</label>
      <input type="number" id="sweepFrom" value="20" min="1" max="20000">
      <label style="min-width:auto">До (Гц):</label>
      <input type="number" id="sweepTo" value="20000" min="1" max="20000">
      <label style="min-width:auto">Длит (с):</label>
      <input type="number" id="sweepDuration" value="2" min="0.2" max="30" step="0.1">
      <button class="primary" onclick="doSweep()">Запустить свип</button>
    </div>

    <hr>

    <div class="row" style="justify-content:center">
      <span id="playingIndicator"></span>
      <button id="generateButton" class="primary" onclick="toggleSound()">▶ Генерировать звук</button>
      <button id="stopButton" class="danger" onclick="stopSound()" disabled>⏹ Стоп</button>
    </div>
    <div class="hint">
      <b>Пробел</b> — вкл/выкл &nbsp;·&nbsp; <b>←/→</b> — ±10 Гц
    </div>
  </div>

  <div class="panel">
    <h2>Микрофон — «Слушать, а не Слышать»</h2>
    <canvas id="spectrum"></canvas>
    <div class="peak-info" id="peakInfo">—</div>
    <div class="row" style="justify-content:center">
      <button id="micButton" class="primary" onclick="toggleMic()">🎤 Слушать, а не Слышать</button>
    </div>
    <div class="hint">
      Спектр в реальном времени, лог-шкала: 20 Гц — 20 кГц. Анализирует звук с микрофона без вывода в динамики.
    </div>
  </div>

  <div class="panel" style="text-align:center">
    <button onclick="run('glist')">← НАЗАД</button>
  </div>
</div>

<script>
  function run(tool) {
    var url = tool + ".html";
    window.open(url, "_blank");
  }
</script>

<script>
// ============ AUDIO SETUP ============
var audioContext = new (window.AudioContext || window.webkitAudioContext)();
var oscillator = null;
var gainNode = null;
var masterAnalyser = null;
var isPlaying = false;
var oscRAF = null;
var oscBuf = null;

var micStream = null, micSource = null, micAnalyser = null, micRAF = null, micBuf = null;

// DOM
var freqInput = document.getElementById("frequency");
var freqSlider = document.getElementById("frequencySlider");
var waveformSelect = document.getElementById("waveform");
var generateButton = document.getElementById("generateButton");
var stopButton = document.getElementById("stopButton");
var playingIndicator = document.getElementById("playingIndicator");
var freqDisplay = document.getElementById("freqDisplay");
var noteDisplay = document.getElementById("noteDisplay");
var oscCanvas = document.getElementById("oscilloscope");
var spectrumCanvas = document.getElementById("spectrum");
var peakInfo = document.getElementById("peakInfo");
var micButton = document.getElementById("micButton");

// ============ HELPERS ============
function clampFreq(v) {
  var n = parseFloat(v);
  if (isNaN(n)) n = 440;
  return Math.min(20000, Math.max(1, Math.round(n)));
}

function freqToNote(freq) {
  if (freq <= 0) return "—";
  var notes = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
  var n = Math.round(12 * Math.log2(freq / 440)) + 69;
  if (n < 0 || n > 127) return "—";
  return notes[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1);
}

function updateDisplays(freq) {
  freqDisplay.textContent = Math.round(freq) + " Hz";
  noteDisplay.textContent = freqToNote(freq);
}

function setFrequency(v) {
  var f = clampFreq(v);
  freqInput.value = f;
  freqSlider.value = f;
  updateDisplays(f);
  if (oscillator) {
    var now = audioContext.currentTime;
    oscillator.frequency.cancelScheduledValues(now);
    oscillator.frequency.setValueAtTime(f, now);
  }
  checkAchievement(f);
}

function changeFrequency(delta) {
  setFrequency(clampFreq(freqInput.value) + delta);
}

// ============ PLAYBACK ============
function startSound() {
  if (audioContext.state === "suspended") audioContext.resume();
  if (isPlaying) return;

  var freq = clampFreq(freqInput.value);

  oscillator = audioContext.createOscillator();
  gainNode = audioContext.createGain();
  masterAnalyser = audioContext.createAnalyser();
  masterAnalyser.fftSize = 2048;

  oscillator.type = waveformSelect.value;
  oscillator.frequency.value = freq;
  // Всегда 100% — громкость регулируется системой устройства
  gainNode.gain.value = 0;

  oscillator.connect(gainNode);
  gainNode.connect(masterAnalyser);
  masterAnalyser.connect(audioContext.destination);

  oscillator.start();

  // Плавный подъём до 100%, чтобы не было щелчка
  var now = audioContext.currentTime;
  gainNode.gain.setValueAtTime(0, now);
  gainNode.gain.linearRampToValueAtTime(1.0, now + 0.05);

  isPlaying = true;
  updatePlayUI();
  drawOscilloscope();
}

function stopSound() {
  if (!oscillator) return;
  var osc = oscillator, g = gainNode, now = audioContext.currentTime;

  // Плавное затухание — без щелчков
  g.gain.cancelScheduledValues(now);
  g.gain.setValueAtTime(g.gain.value, now);
  g.gain.linearRampToValueAtTime(0, now + 0.05);

  setTimeout(function () {
    try { osc.stop(); } catch (e) {}
    try { osc.disconnect(); g.disconnect(); } catch (e) {}
  }, 100);

  oscillator = null; gainNode = null; masterAnalyser = null;
  isPlaying = false;
  if (oscRAF) { cancelAnimationFrame(oscRAF); oscRAF = null; }
  clearCanvas(oscCanvas);
  updatePlayUI();
}

function toggleSound() { isPlaying ? stopSound() : startSound(); }

function updatePlayUI() {
  generateButton.textContent = isPlaying ? "⏸ Пауза" : "▶ Генерировать звук";
  stopButton.disabled = !isPlaying;
  playingIndicator.classList.toggle("on", isPlaying);
}

// ============ LIVE CONTROLS ============
waveformSelect.addEventListener("change", function () {
  if (oscillator) oscillator.type = waveformSelect.value;
});

// Частота: live-preview при вводе, жёсткий clamp на blur
freqInput.addEventListener("input", function () {
  var v = parseFloat(freqInput.value);
  if (!isNaN(v) && v >= 1 && v <= 20000) {
    freqSlider.value = v;
    updateDisplays(v);
    if (oscillator) {
      var now = audioContext.currentTime;
      oscillator.frequency.cancelScheduledValues(now);
      oscillator.frequency.setValueAtTime(v, now);
    }
    checkAchievement(v);
  }
});
freqInput.addEventListener("change", function () {
  setFrequency(freqInput.value);
});
freqSlider.addEventListener("input", function () {
  setFrequency(freqSlider.value);
});

// ============ SWEEP ============
function doSweep() {
  if (!isPlaying) startSound();
  if (!oscillator) return;

  var from = clampFreq(document.getElementById("sweepFrom").value);
  var to = clampFreq(document.getElementById("sweepTo").value);
  var dur = Math.max(0.1, parseFloat(document.getElementById("sweepDuration").value) || 2);

  var now = audioContext.currentTime;
  oscillator.frequency.cancelScheduledValues(now);
  oscillator.frequency.setValueAtTime(from, now);
  if (from !== to) {
    // Экспоненциальный свип звучит «естественнее» для слуха
    oscillator.frequency.exponentialRampToValueAtTime(to, now + dur);
  }

  freqInput.value = from;
  freqSlider.value = from;
  updateDisplays(from);

  setTimeout(function () {
    if (!oscillator) return;
    freqInput.value = to;
    freqSlider.value = to;
    updateDisplays(to);
  }, dur * 1000 + 50);
}

// ============ CANVAS UTILS ============
function resizeCanvas(canvas) {
  var dpr = window.devicePixelRatio || 1;
  var w = Math.max(1, Math.floor(canvas.clientWidth * dpr));
  var h = Math.max(1, Math.floor(canvas.clientHeight * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w; canvas.height = h;
  }
}

function clearCanvas(canvas) {
  var ctx = canvas.getContext("2d");
  resizeCanvas(canvas);
  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// ============ OSCILLOSCOPE ============
function drawOscilloscope() {
  if (!masterAnalyser || !isPlaying) return;
  oscRAF = requestAnimationFrame(drawOscilloscope);

  var canvas = oscCanvas;
  var ctx = canvas.getContext("2d");
  resizeCanvas(canvas);
  var W = canvas.width, H = canvas.height;

  if (!oscBuf || oscBuf.length !== masterAnalyser.fftSize) {
    oscBuf = new Uint8Array(masterAnalyser.fftSize);
  }
  masterAnalyser.getByteTimeDomainData(oscBuf);

  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(0, 0, W, H);

  // сетка
  ctx.strokeStyle = "#1a1a1a";
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (var x = 0; x < W; x += W / 10) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (var y = 0; y < H; y += H / 4) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  // сигнал
  ctx.strokeStyle = "#00bcd4";
  ctx.lineWidth = Math.max(1.5, W / 800);
  ctx.beginPath();
  var step = W / oscBuf.length;
  for (var i = 0; i < oscBuf.length; i++) {
    var y = (oscBuf[i] / 128.0) * H / 2;
    if (i === 0) ctx.moveTo(0, y);
    else ctx.lineTo(i * step, y);
  }
  ctx.stroke();
}

// ============ MICROPHONE ============
async function toggleMic() {
  if (micStream) stopMic();
  else await startMic();
}

async function startMic() {
  if (audioContext.state === "suspended") await audioContext.resume();
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    micSource = audioContext.createMediaStreamSource(micStream);
    micAnalyser = audioContext.createAnalyser();
    micAnalyser.fftSize = 8192;
    micAnalyser.smoothingTimeConstant = 0.6;
    micSource.connect(micAnalyser);
    // НЕ подключаем к destination — иначе будет обратная связь

    micButton.textContent = "⏹ Хватит слушать";
    micButton.classList.remove("primary");
    micButton.classList.add("danger");
    drawSpectrum();
  } catch (e) {
    alert("Не удалось получить доступ к микрофону: " + e.message);
  }
}

function stopMic() {
  if (micRAF) { cancelAnimationFrame(micRAF); micRAF = null; }
  if (micStream) {
    micStream.getTracks().forEach(function (t) { t.stop(); });
    micStream = null;
  }
  if (micSource) { micSource.disconnect(); micSource = null; }
  micAnalyser = null;
  micBuf = null;

  micButton.textContent = "🎤 Слушать, а не Слышать";
  micButton.classList.add("primary");
  micButton.classList.remove("danger");
  peakInfo.textContent = "—";
  clearCanvas(spectrumCanvas);
}

function drawSpectrum() {
  if (!micAnalyser) return;
  micRAF = requestAnimationFrame(drawSpectrum);

  var canvas = spectrumCanvas;
  var ctx = canvas.getContext("2d");
  resizeCanvas(canvas);
  var W = canvas.width, H = canvas.height;

  if (!micBuf || micBuf.length !== micAnalyser.frequencyBinCount) {
    micBuf = new Uint8Array(micAnalyser.frequencyBinCount);
  }
  micAnalyser.getByteFrequencyData(micBuf);

  ctx.fillStyle = "#0a0a0a";
  ctx.fillRect(0, 0, W, H);

  var nyquist = audioContext.sampleRate / 2;
  var binCount = micAnalyser.frequencyBinCount;
  var minFreq = 20;
  var maxFreq = Math.min(20000, nyquist);
  var logMin = Math.log10(minFreq);
  var logMax = Math.log10(maxFreq);

  // Полосы спектра (per-pixel по лог-оси)
  for (var x = 0; x < W; x++) {
    var logF = logMin + (x / W) * (logMax - logMin);
    var freq = Math.pow(10, logF);
    var bin = Math.round(freq / nyquist * binCount);
    if (bin >= binCount) bin = binCount - 1;
    var mag = micBuf[bin];
    var t = mag / 255;
    if (t < 0.015) continue;

    // HSL-градиент как в Spectroid: синий → циан → зелёный → жёлтый → красный
    var hue = 240 * (1 - t);
    var light = 25 + t * 35;
    ctx.fillStyle = "hsl(" + hue + ",100%," + light + "%)";
    ctx.fillRect(x, H - t * H, 1, t * H);
  }

  // Сетка частот
  ctx.strokeStyle = "rgba(255,255,255,0.15)";
  ctx.fillStyle = "rgba(255,255,255,0.55)";
  ctx.font = (11 * (window.devicePixelRatio || 1)) + "px sans-serif";
  ctx.lineWidth = 1;
  [100, 1000, 10000].forEach(function (f) {
    var gx = ((Math.log10(f) - logMin) / (logMax - logMin)) * W;
    ctx.beginPath();
    ctx.moveTo(gx, 0); ctx.lineTo(gx, H);
    ctx.stroke();
    var label = f >= 1000 ? (f / 1000) + "k" : f.toString();
    ctx.fillText(label, gx + 4, 16 * (window.devicePixelRatio || 1));
  });

  // Пик
  var peakBin = 0, peakMag = 0;
  for (var i = 2; i < binCount; i++) {
    if (micBuf[i] > peakMag) { peakMag = micBuf[i]; peakBin = i; }
  }
  var peakFreq = peakBin / binCount * nyquist;

  if (peakMag > 30 && peakFreq > 20) {
    peakInfo.textContent = Math.round(peakFreq) + " Гц — " + freqToNote(peakFreq);
    var px = ((Math.log10(peakFreq) - logMin) / (logMax - logMin)) * W;
    if (px >= 0 && px <= W) {
      ctx.strokeStyle = "rgba(255,255,255,0.9)";
      ctx.lineWidth = Math.max(1, W / 600);
      ctx.beginPath();
      ctx.moveTo(px, 0); ctx.lineTo(px, H);
      ctx.stroke();
    }
  } else {
    peakInfo.textContent = "Тишина…";
  }
}

// ============ HOTKEYS ============
document.addEventListener("keydown", function (e) {
  var tag = document.activeElement && document.activeElement.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;

  if (e.code === "Space") { e.preventDefault(); toggleSound(); }
  else if (e.code === "ArrowLeft") { e.preventDefault(); changeFrequency(-10); }
  else if (e.code === "ArrowRight") { e.preventDefault(); changeFrequency(10); }
});

// ============ UNLOAD ============
window.addEventListener("beforeunload", function () {
  if (oscillator) { try { oscillator.stop(); } catch (e) {} }
  if (micStream) { micStream.getTracks().forEach(function (t) { t.stop(); }); }
});

// ============ ACHIEVEMENTS ============
var achievementFired = false;

function initDB() {
  return new Promise(function (resolve, reject) {
    var request = indexedDB.open("AchievementsDB", 1);
    request.onerror = function () { reject(request.error); };
    request.onsuccess = function () { resolve(request.result); };
    request.onupgradeneeded = function (event) {
      var db = event.target.result;
      if (!db.objectStoreNames.contains("achievements")) {
        db.createObjectStore("achievements", { keyPath: "title" });
      }
    };
  });
}

async function addAchievement(title, text, image) {
  try {
    var db = await initDB();
    var tx = db.transaction(["achievements"], "readwrite");
    var store = tx.objectStore("achievements");
    var checkReq = store.get(title);
    return new Promise(function (resolve) {
      checkReq.onsuccess = function () {
        if (!checkReq.result) {
          var newAch = { title: title, text: text, image: image || "button.png" };
          store.add(newAch).onsuccess = function () {
            var div = document.createElement("div");
            div.textContent = "🏆 " + title;
            div.style.cssText = "position:fixed;top:15px;left:5%;width:90%;background:#ffd700;color:#1a1a1a;padding:12px;border-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,0.3);z-index:1000;text-align:center;font-weight:600";
            document.body.appendChild(div);
            setTimeout(function () { div.remove(); }, 3000);
            resolve(true);
          };
        } else {
          resolve(false);
        }
      };
    });
  } catch (e) {
    console.error("Ach error:", e);
    return false;
  }
}

function checkAchievement(freq) {
  if (freq >= 15000 && !achievementFired) {
    achievementFired = true;
    addAchievement("Ай, больно!", "Зачем ты мучаешь мои уши?", "button.png");
  }
}

// ============ INIT ============
updateDisplays(440);
clearCanvas(oscCanvas);
clearCanvas(spectrumCanvas);
updatePlayUI();
</script>
</body>
</html>
